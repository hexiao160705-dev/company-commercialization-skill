next action. Use when the user asks \"triage this lead\", \"triage my leads\", \"rank my lead backlog\", \"is [company] a good lead\", \"qualify [lead]\", or pastes or uploads lead info.", "path": "references/sources/knowledge-work-plugins/sales/skills/lead-triage/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/lead-triage/SKILL.md", "sha256": "7fa6ee9b73ffbdbe6989f3396738534d9077814054d02c1a25b3758e9b3b806c", "zh": "筛选并安排线索优先级"}, "account-research": {"id": "account-research", "name": "account-research", "desc": "Research a target company and optionally a specific contact - company overview, recent news, likely priorities, and fit against your ICP. Cross-references existing CRM records. Use when the user asks to \"research [company]\", \"look into [company]\", \"prospect research on [company]\", \"look up [person]\", \"intel on [prospect]\", \"who is [person] at [company]\", or \"tell me about [company]\" when the company is a prospect rather than an existing account.", "path": "references/sources/knowledge-work-plugins/sales/skills/account-research/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/account-research/SKILL.md", "sha256": "1f5e40ac7cea793dff344f331be95bf2bd6fd8e03c6734aedae2d514707ec59b", "zh": "整理目标客户背景"}, "account-tiering": {"id": "account-tiering", "name": "account-tiering", "desc": "Score and tier a list of accounts (or your full book) against ICP fit and engagement signals to prioritize where to spend time. Use when the user asks to \"tier my accounts\", \"prioritize my book\", \"which accounts should I focus on\", or \"score these accounts\".", "path": "references/sources/knowledge-work-plugins/sales/skills/account-tiering/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/account-tiering/SKILL.md", "sha256": "9013610cb11d278af18ea53df942e6d4f874c56087bb9b32ec38e8f6a3efb22a", "zh": "按价值与机会划分客户等级"}, "call-prep": {"id": "call-prep", "name": "call-prep", "desc": "Pre-call brief for an upcoming meeting - attendees, account history, prior call context from transcripts, open opportunity status, and suggested discovery questions. Use when the user asks \"prep me for [meeting/company]\", \"call prep [company]\", \"I'm meeting with [company], prep me\", \"get me ready for [meeting]\", or \"what do I need to know before my [time] call\".", "path": "references/sources/knowledge-work-plugins/sales/skills/call-prep/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/call-prep/SKILL.md", "sha256": "4f772694f3f8fc1ef0d8bb8bb868f6c44661160f57c99dd8c9ebf97f7fe2a947", "zh": "准备销售通话目标和问题"}, "handle-objection": {"id": "handle-objection", "name": "handle-objection", "desc": "Work through a live objection or competitive threat - what's really being said, the response that has worked before, and the proof points to use, grounded in your own win/loss history and customer quotes. Use when the user says \"they said we're too expensive\", \"how do I respond to [objection]\", \"[competitor] is in the deal\", \"help me handle this pushback\", or pastes an objection from an email or call.", "path": "references/sources/knowledge-work-plugins/sales/skills/handle-objection/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/handle-objection/SKILL.md", "sha256": "88d2da6cd89218459271ab6159ef981b88b6f763148b3955b56277d30acc4e19", "zh": "回应客户购买异议"}, "sales-enablement": {"id": "sales-enablement", "name": "sales-enablement", "desc": "When the user wants sales collateral, or asks what to give a champion or rep, or how to answer an objection or make the case: decks, one-pagers, objection handling, demo scripts, talk tracks, battle cards, proposals, win-loss. For public comparison pages, see competitors. For buyer research, see customer-research. For website copy, see copywriting. For cold emails, see cold-email. For the offer, see offers.", "path": "references/sources/marketingskills/skills/sales-enablement/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/sales-enablement/SKILL.md", "sha256": "6869bac9c9f5e404bc01de85800f8d90ccfb2c06d25fb2bafe1d3d4f2e61fc36", "zh": "为销售团队准备材料"}, "deal-review": {"id": "deal-review", "name": "deal-review", "desc": "Deep-dive on a single opportunity - signal-adjusted health score, risks, gaps in qualification, and recommended next actions. Use when the user asks \"review the [account] deal\", \"deal review on [opp]\", \"is [opp] going to close\", or \"what's the risk on [deal]\".", "path": "references/sources/knowledge-work-plugins/sales/skills/deal-review/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/deal-review/SKILL.md", "sha256": "a78f8382d1f65ae57f8468bd4c76c2ccfec2a7d0f47ac15db44b31aa53568700", "zh": "核查交易进展的证据"}, "close-plan": {"id": "close-plan", "name": "close-plan", "desc": "Build the business case and mutual action plan for a deal - the why-buy/why-now story, the ROI framing, and the dated step-by-step path to signature shared with the customer. Use when the user says \"build a close plan for [deal]\", \"mutual action plan for [account]\", \"business case for [opp]\", or \"what's the path to signature\".", "path": "references/sources/knowledge-work-plugins/sales/skills/close-plan/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/close-plan/SKILL.md", "sha256": "4fb19d3822e79d94c60f1428f69a89ed9caebe4f72600e32bcd1b096f2c00a62", "zh": "与客户约定成交步骤"}, "pipeline-review": {"id": "pipeline-review", "name": "pipeline-review", "desc": "Stage-by-stage pipeline health check - coverage, aging, conversion, and at-risk deals - from CRM opportunity data. Use when the user asks \"review my pipeline\", \"pipeline health\", \"where's my pipeline stuck\", \"weekly pipeline review\", \"which deals should I focus on this week\", \"any stale or stuck deals\", \"which deals have past close dates\", \"which deals are single-threaded\", or \"check my pipeline coverage against my number\".", "path": "references/sources/knowledge-work-plugins/sales/skills/pipeline-review/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/pipeline-review/SKILL.md", "sha256": "36baa5f9c9a64a4c9eb036676ebe6af7a2ebd168e4f21ac1bf3c385ad2e47028", "zh": "按阶段检查销售机会"}, "forecast": {"id": "forecast", "name": "forecast", "desc": "Generate the commit / best-case / pipeline narrative for a forecast call or a 1:1 with your manager - what's closing, what's at risk, what changed since last time. Use when the user asks \"write my forecast\", \"forecast narrative\", \"prep for forecast call\", \"prep for my quarterly forecast call\", \"which deals should I commit vs. call upside\", \"forecast from this pipeline export\", or \"prep for my 1:1 with my manager\".", "path": "references/sources/knowledge-work-plugins/sales/skills/forecast/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/forecast/SKILL.md", "sha256": "23b355ac3f994c729bf6271b7e0533dcf1ae2f4bd51104696624ef009cace37e", "zh": "评估预测金额和时间"}, "deal-desk": {"id": "deal-desk", "name": "deal-desk", "desc": "Use before closing a deal that needs a discount beyond AE authority, has a redlined MSA or unclear per-deal economics. Scores it with deal_scorer.py, names approvers with discount_approval_router.py and flags risky terms with terms_redliner.py. Never auto-approves.", "path": "references/sources/claude-skills/commercial/skills/deal-desk/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/commercial/skills/deal-desk/SKILL.md", "sha256": "d8ff6f5c501f230428134cefded66f035f999e3f9f99eefd1c9edb9fd1f79b7c", "zh": "核查折扣与例外报价"}, "rfp-responder": {"id": "rfp-responder", "name": "rfp-responder", "desc": "Use when an RFP, RFI, RFQ or security or vendor questionnaire arrives. Parses mandatory vs weighted requirements with rfp_parser.py, drafts proof-point answers with response_drafter.py and estimates win chance with winrate_predictor.py.", "path": "references/sources/claude-skills/commercial/skills/rfp-responder/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/commercial/skills/rfp-responder/SKILL.md", "sha256": "7eaaf958a00abbb7cdf13ab53236e3dbe0c246798adc7355b4113ef9011123bc", "zh": "编写招标需求响应材料"}, "cohort-analysis": {"id": "cohort-analysis", "name": "cohort-analysis", "desc": "Perform cohort analysis on user engagement data — retention curves, feature adoption trends, and segment-level insights. Use when analyzing user retention by cohort, studying feature adoption over time, investigating churn patterns, or identifying engagement trends.", "path": "references/sources/pm-skills/pm-data-analytics/skills/cohort-analysis/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-data-analytics/skills/cohort-analysis/SKILL.md", "sha256": "bd721a429e58c71a1a488ac1e89ba2bcbb9e179cb9c0b5eac44a3c3b3e9fdb15", "zh": "按同期客群比较留存表现"}, "customer-health": {"id": "customer-health", "name": "customer-health", "desc": "Health check on a customer account and QBR-ready prep - relationship strength, engagement trend, risk signals, value delivered, and the agenda that makes the review worth their time. Use when the user asks \"how healthy is [account]\", \"customer health check\", \"prep the [account] QBR\", \"business review prep\", or \"are we at risk with [customer]\".", "path": "references/sources/knowledge-work-plugins/sales/skills/customer-health/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/customer-health/SKILL.md", "sha256": "dcfcae0bce25de315e575a783c66fc7509d479cab4045d5f9ce53831ed2363d1", "zh": "识别客户关系和使用风险"}, "renewal-radar": {"id": "renewal-radar", "name": "renewal-radar", "desc": "Upcoming renewals with timing, risk, and uplift potential - and the renewal opportunity records to keep them honest. Use when the user asks \"what renewals are coming up\", \"renewal radar\", \"is [account] going to renew\", \"prep the [account] renewal\", or \"which renewals are at risk\".", "path": "references/sources/knowledge-work-plugins/sales/skills/renewal-radar/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/renewal-radar/SKILL.md", "sha256": "8543ca43deb5c9af9725975d23de2ca2ed456c3afd298f8189edaecc7432b92d", "zh": "筛出将到期合同与续约风险"}, "churn-prevention": {"id": "churn-prevention", "name": "churn-prevention", "desc": "When the user wants to reduce churn, or asks why customers cancel, whether to offer a discount or pause: cancellation flows, exit surveys, save offers, dunning and failed-payment recovery. For win-back emails, see emails. For in-app upgrade screens, see paywalls.", "path": "references/sources/marketingskills/skills/churn-prevention/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/churn-prevention/SKILL.md", "sha256": "ddfa4dda517edade4e5b49254fff037a037ed83d66cf7f4e84a676495823eea6", "zh": "设计取消挽回和预防措施"}, "expansion-whitespace": {"id": "expansion-whitespace", "name": "expansion-whitespace", "desc": "Find the expansion whitespace in an account or a book - what they own vs. what they could own, the evidence for each play, and the open opps to create. Use when the user asks \"what's the whitespace at [account]\", \"where can I expand [account]\", \"upsell opportunities in my book\", or \"which customers should I be growing\".", "path": "references/sources/knowledge-work-plugins/sales/skills/expansion-whitespace/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/expansion-whitespace/SKILL.md", "sha256": "42103b1c1b6eae0c742ce78e83608fee464df6e725ffa99f0b0607c61cc18ea4", "zh": "寻找既有客户的增购空间"}, "user-segmentation": {"id": "user-segmentation", "name": "user-segmentation", "desc": "Segment users from feedback data based on behavior, JTBD, and needs. Identifies at least 3 distinct user segments. Use when segmenting a user base, analyzing diverse user feedback, or building a segmentation model.", "path": "references/sources/pm-skills/pm-market-research/skills/user-segmentation/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-market-research/skills/user-segmentation/SKILL.md", "sha256": "d91f745c9520e6a31c07e37c14bfa01e7982570e30a398be71cf324ac93be9c8", "zh": "按行为或需求对用户分群"}, "growth-loops": {"id": "growth-loops", "name": "growth-loops", "desc": "Identify growth loops (flywheels) for sustainable traction. Evaluates 5 loop types: Viral, Usage, Collaboration, User-Generated, and Referral. Use when designing growth mechanisms, building product-led traction, or understanding how growth loops work.", "path": "references/sources/pm-skills/pm-go-to-market/skills/growth-loops/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-go-to-market/skills/growth-loops/SKILL.md", "sha256": "ce93f8c3f3a5db135aff02c5859bc153b9bd376b93f97a1c68e5ca498cf53557", "zh": "规划可持续的增长循环"}, "north-star-metric": {"id": "north-star-metric", "name": "north-star-metric", "desc": "Define a North Star Metric and 3-5 supporting input metrics that form a metrics constellation. Classify the business game (Attention, Transaction, Productivity) and validate against 7 criteria for an effective North Star. Use when choosing a North Star Metric, setting up a metrics framework, learning about the North Star Framework, or deciding what to measure.", "path": "references/sources/pm-skills/pm-marketing-growth/skills/north-star-metric/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-marketing-growth/skills/north-star-metric/SKILL.md", "sha256": "00242397486a88bb7e91a1d6c99e29fd51bdc9a1cd5def9771988fb40c195fb8", "zh": "选择反映核心价值的指标"}, "ticket-triage": {"id": "ticket-triage", "name": "ticket-triage", "desc": "Triage and prioritize a support ticket or customer issue. Use when a new ticket comes in and needs categorization, assigning P1-P4 priority, deciding which team should handle it, or checking whether it's a duplicate or known issue before routing.", "path": "references/sources/knowledge-work-plugins/customer-support/skills/ticket-triage/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/customer-support/skills/ticket-triage/SKILL.md", "sha256": "d0e5e95443e358ad2a74811b196071d10807ca95aa20351ab5760feeecee1294", "zh": "判定工单优先级与归属"}, "customer-escalation": {"id": "customer-escalation", "name": "customer-escalation", "desc": "Package an escalation for engineering, product, or leadership with full context. Use when a bug needs engineering attention beyond normal support, multiple customers report the same issue, a customer is threatening to churn, or an issue has sat unresolved past its SLA.", "path": "references/sources/knowledge-work-plugins/customer-support/skills/customer-escalation/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/customer-support/skills/customer-escalation/SKILL.md", "sha256": "90c33574a41371e8e116aaf40237141adcd6075ef8bcb9de993de2b543867b3e", "zh": "升级复杂客户问题"}, "draft-response": {"id": "draft-response", "name": "draft-response", "desc": "Draft a professional customer-facing response tailored to the situation and relationship. Use when answering a product question, responding to an escalation or outage, delivering bad news like a delay or won't-fix, declining a feature request, or replying to a billing issue.", "path": "references/sources/knowledge-work-plugins/customer-support/skills/draft-response/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/customer-support/skills/draft-response/SKILL.md", "sha256": "1a201228b75a98fc3b5d45090cb7443d50df204b2ee748bfc8970790a64f0026", "zh": "根据事实起草客服回复"}, "kb-article": {"id": "kb-article", "name": "kb-article", "desc": "Draft a knowledge base article from a resolved issue or common question. Use when a ticket resolution is worth documenting for self-service, the same question keeps coming up, a workaround needs to be published, or a known issue should be communicated to customers.", "path": "references/sources/knowledge-work-plugins/customer-support/skills/kb-article/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/customer-support/skills/kb-article/SKILL.md", "sha256": "cfc300f5ecc5128910a8ff04514d565a45ca9178bf1dc2a40cc40e2ce4db9292", "zh": "将常见问题写成知识库文章"}, "customer-research": {"id": "customer-research", "name": "customer-research", "desc": "When the user wants to run or synthesize customer research, or asks what customer quotes, reviews, or feedback really mean, what is safe to conclude, and what to ask next: interviews, surveys, voice of customer, personas, JTBD, mining Reddit and reviews. For copy from research, see copywriting. For acting on it in pages, see cro.", "path": "references/sources/marketingskills/skills/customer-research/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/customer-research/SKILL.md", "sha256": "d12b522641884acb385f7a919138b5bfbe4ad9b070bd13a470923eebaa682a4f", "zh": "研究客户的购买动机和语言"}, "competitive-intelligence": {"id": "competitive-intelligence", "name": "competitive-intelligence", "desc": "Competitive analysis two ways - the in-deal play against a named competitor, and win/loss patterns, competitor mentions, and battlecards across the book. Use when the user asks \"competitive intel\", \"research competitors\", \"how do we compare to [competitor]\", \"what's new with [competitor]\", \"battlecard for [competitor]\", \"how do we beat [competitor]\", \"what's the play against [competitor] in [deal]\", \"where are we losing to [competitor]\", \"win/loss patterns\", \"competitive analysis\", \"refresh the battlecards\", or on a weekly schedule.", "path": "references/sources/knowledge-work-plugins/sales/skills/competitive-intelligence/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/competitive-intelligence/SKILL.md", "sha256": "aa0041f9133e8901fcdd4768b907c5c8f50c4f15edcce8c04b0d3a8a9a6e6811", "zh": "跟踪竞争对手变化"}, "competitive-battlecard": {"id": "competitive-battlecard", "name": "competitive-battlecard", "desc": "Create sales-ready competitive battlecards comparing your product against a specific competitor — positioning, feature comparison, objection handling, and win/loss patterns. Use when preparing sales teams, creating competitive materials, or responding to 'why not competitor X?'", "path": "references/sources/pm-skills/pm-go-to-market/skills/competitive-battlecard/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-go-to-market/skills/competitive-battlecard/SKILL.md", "sha256": "89a82a58675d7c82f9d9d2efc7ab81ca0597264804d4ab722ae354d767ebac21", "zh": "制作销售竞品对照卡"}, "competitor-profiling": {"id": "competitor-profiling", "name": "competitor-profiling", "desc": "When the user wants to research competitors into dated profiles, or asks what a rival charges, claims, or is doing, or whether a conclusion about them is fair: positioning, pricing, features, reviews, SEO, observed facts kept apart from inference. For comparison pages, see competitors. For battle cards, see sales-enablement. For accounts you sell to, see prospecting. For how a competitor grew, see reverse-engineer-marketing.", "path": "references/sources/marketingskills/skills/competitor-profiling/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/competitor-profiling/SKILL.md", "sha256": "ebe96d2a92094b6da24b7b1be489302dcd547f4aabf5b820778605cbb4ef741d", "zh": "建立竞争对手档案"}, "win-loss-review": {"id": "win-loss-review", "name": "win-loss-review", "desc": "Analyze recently closed opportunities to find patterns in what wins and what loses - stage of loss, common objections from transcripts, deal characteristics. Leader-focused. Use when the user asks \"win loss review\", \"why are we losing deals\", \"what's working\", or \"analyze closed opps\".", "path": "references/sources/knowledge-work-plugins/sales/skills/win-loss-review/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/win-loss-review/SKILL.md", "sha256": "aa991b88dd30c489e404724e37d4cdd74141cb98718cc3c7b7bc555216ffbaed", "zh": "分析赢单与丢单原因"}, "customer-voice": {"id": "customer-voice", "name": "customer-voice", "desc": "Surface what customers are actually saying - direct attributed quotes on a topic across call transcripts and email, across your accounts. Use when the user asks \"what are customers saying about [topic]\", \"pull quotes on [objection/feature/competitor]\", \"voice of customer on [X]\", or \"what's coming up in calls\".", "path": "references/sources/knowledge-work-plugins/sales/skills/customer-voice/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/customer-voice/SKILL.md", "sha256": "00c1d855da79a696a18f315a7500364f70d37ac1fcc70496433ba95f2e02d48b", "zh": "汇总客户原声与趋势"}, "analyze-feature-requests": {"id": "analyze-feature-requests", "name": "analyze-feature-requests", "desc": "Analyze and prioritize a list of feature requests by theme, strategic alignment, impact, effort, and risk. Use when reviewing customer feature requests, triaging a backlog, or making prioritization decisions.", "path": "references/sources/pm-skills/pm-product-discovery/skills/analyze-feature-requests/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/analyze-feature-requests/SKILL.md", "sha256": "7615db7687a668a99e015664295f849bfab696a8dd7b3c02b0200a512c6ad3c2", "zh": "整理并归类功能请求"}, "metrics-review": {"id": "metrics-review", "name": "metrics-review", "desc": "Review and analyze product metrics with trend analysis and actionable insights. Use when running a weekly, monthly, or quarterly metrics review, investigating a sudden spike or drop, comparing performance against targets, or turning raw numbers into a scorecard with recommended actions.", "path": "references/sources/knowledge-work-plugins/product-management/skills/metrics-review/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/product-management/skills/metrics-review/SKILL.md", "sha256": "e92f364b668074c72b36fd0f69a6adef2ead66640b2c17dc824c043fb613d278", "zh": "审查产品指标变化"}, "review-contract": {"id": "review-contract", "name": "review-contract", "desc": "Review a contract against your organization's negotiation playbook — flag deviations, generate redlines, provide business impact analysis. Use when reviewing vendor or customer agreements, when you need clause-by-clause analysis against standard positions, or when preparing a negotiation strategy with prioritized redlines and fallback positions.", "path": "references/sources/knowledge-work-plugins/legal/skills/review-contract/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/legal/skills/review-contract/SKILL.md", "sha256": "3a6413475f51adedbff130f4d5aabbeeacfb2abd323e0338bc91c21937fbfb76", "zh": "审阅合同条款与偏差"}, "triage-nda": {"id": "triage-nda", "name": "triage-nda", "desc": "Rapidly triage an incoming NDA and classify it as GREEN (standard approval), YELLOW (counsel review), or RED (full legal review). Use when a new NDA arrives from sales or business development, when screening for embedded non-solicits, non-competes, or missing carveouts, or when deciding whether an NDA can be signed under standard delegation.", "path": "references/sources/knowledge-work-plugins/legal/skills/triage-nda/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/legal/skills/triage-nda/SKILL.md", "sha256": "767a8f6759268e003ee882af8dfb56579aca2121b9dc49a2c65c4e77de93f768", "zh": "筛查保密协议的风险条款"}, "draft-nda": {"id": "draft-nda", "name": "draft-nda", "desc": "Draft a detailed Non-Disclosure Agreement between two parties covering information types, jurisdiction, and clauses needing legal review. Use when creating confidentiality agreements or preparing an NDA for a partnership.", "path": "references/sources/pm-skills/pm-toolkit/skills/draft-nda/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-toolkit/skills/draft-nda/SKILL.md", "sha256": "e37a613bae8038220aac1e45f73596a419920015abe28d4a012d339a0e018247", "zh": "起草保密协议"}, "compliance-check": {"id": "compliance-check", "name": "compliance-check", "desc": "Run a compliance check on a proposed action, product feature, or business initiative, surfacing applicable regulations, required approvals, and risk areas. Use when launching a feature that touches personal data, when marketing or product proposes something with regulatory implications, or when you need to know which approvals and jurisdictional requirements apply before proceeding.", "path": "references/sources/knowledge-work-plugins/legal/skills/compliance-check/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/legal/skills/compliance-check/SKILL.md", "sha256": "8dff8ebe7eda9ad5e38f3faf1016a7fc1eeba65bcdb7f5ae45ea507824bbc1c2", "zh": "核对适用的合规义务"}, "legal-response": {"id": "legal-response", "name": "legal-response", "desc": "Generate a response to a common legal inquiry using configured templates, with built-in escalation checks for situations that shouldn't use a templated reply. Use when responding to data subject requests, litigation hold notices, vendor legal questions, NDA requests from business teams, or subpoenas.", "path": "references/sources/knowledge-work-plugins/legal/skills/legal-response/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/legal/skills/legal-response/SKILL.md", "sha256": "b3a0585ee00a53ccb159fbf5b7dd4d4b45c39e5e65cc8f4f39cbb134fef493db", "zh": "拟定法律询问回复"}, "vendor-check": {"id": "vendor-check", "name": "vendor-check", "desc": "Check the status of existing agreements with a vendor across all connected systems — CLM, CRM, email, and document storage — with gap analysis and upcoming deadlines. Use when onboarding or renewing a vendor, when you need a consolidated view of what's signed and what's missing (MSA, DPA, SOW), or when checking for approaching expirations and surviving obligations.", "path": "references/sources/knowledge-work-plugins/legal/skills/vendor-check/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/legal/skills/vendor-check/SKILL.md", "sha256": "38be57a5e9e959874d2cb78e8493211664bc452e6225cb5bdbb8b12e6f444d2e", "zh": "检查供应商的法律事项"}, "privacy-policy": {"id": "privacy-policy", "name": "privacy-policy", "desc": "Draft a detailed privacy policy covering data types, jurisdiction, GDPR and compliance considerations, and clauses needing legal review. Use when creating a privacy policy, updating data protection documentation, or preparing for compliance.", "path": "references/sources/pm-skills/pm-toolkit/skills/privacy-policy/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-toolkit/skills/privacy-policy/SKILL.md", "sha256": "4388e746dbde28b3eb04bbd88f8a8fe526545fce68a6e5a058d2f70ecadf364f", "zh": "起草隐私政策"}, "compliance-tracking": {"id": "compliance-tracking", "name": "compliance-tracking", "desc": "Track compliance requirements and audit readiness. Trigger with \"compliance\", \"audit prep\", \"SOC 2\", \"ISO 27001\", \"GDPR\", \"regulatory requirement\", or when the user needs help tracking, preparing for, or documenting compliance activities.", "path": "references/sources/knowledge-work-plugins/operations/skills/compliance-tracking/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/operations/skills/compliance-tracking/SKILL.md", "sha256": "644d393abdfddc8c37f7a7804f601e7bbd476e95571e6dcb4d916e478ba8ebd5", "zh": "跟踪合规要求和整改进度"}, "cash-flow-snapshot": {"id": "cash-flow-snapshot", "name": "cash-flow-snapshot", "desc": "Reads AR/AP, historical cash timing, and known fixed costs from the ledger (MYOB, NetSuite, QuickBooks, Xero, or Zoho Books) or from PayPal, Square, or Stripe — or a CSV upload — and produces a 30/60/90-day cash flow forecast with percentage-variance confidence bands and named risk flags. Delivers a chat summary and a downloadable XLSX. Use when the user asks \"forecast my cash flow,\" \"will I make payroll,\" mentions \"runway,\" or says \"cash crunch.\" Falls back to CSV upload when no connector is live.", "path": "references/sources/knowledge-work-plugins/small-business/skills/cash-flow-snapshot/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/small-business/skills/cash-flow-snapshot/SKILL.md", "sha256": "1e5584378c5817981899bfa81296d8a9c2a7e4381a2f1deed616194e51944fff", "zh": "整理现金头寸与短期缺口"}, "reconciliation": {"id": "reconciliation", "name": "reconciliation", "desc": "Reconcile accounts by comparing GL balances to subledgers, bank statements, or third-party data. Use when performing bank reconciliations, GL-to-subledger recs, intercompany reconciliations, or identifying and categorizing reconciling items.", "path": "references/sources/knowledge-work-plugins/finance/skills/reconciliation/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/finance/skills/reconciliation/SKILL.md", "sha256": "aa17e90539f4d4d84130c910c7f527236bfaa71977c4c03493c8e8e515ddeea6", "zh": "对账并查明差异"}, "journal-entry-prep": {"id": "journal-entry-prep", "name": "journal-entry-prep", "desc": "Prepare journal entries with proper debits, credits, and supporting documentation for month-end close. Use when booking accruals, prepaid amortization, fixed asset depreciation, payroll entries, revenue recognition, or any manual journal entry.", "path": "references/sources/knowledge-work-plugins/finance/skills/journal-entry-prep/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/finance/skills/journal-entry-prep/SKILL.md", "sha256": "122715fb18246c2f04d31a5f7c07584ecbfc5c0b46ee09b4c0f4557767d7351e", "zh": "准备有凭证支持的会计分录"}, "close-management": {"id": "close-management", "name": "close-management", "desc": "Manage the month-end close process with task sequencing, dependencies, and status tracking. Use when planning the close calendar, tracking close progress, identifying blockers, or sequencing close activities by day.", "path": "references/sources/knowledge-work-plugins/finance/skills/close-management/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/finance/skills/close-management/SKILL.md", "sha256": "6c2df93bcd15eddf65017445fa44f3eb0b16a755711a5e0602d73ca595e73732", "zh": "安排财务关账工作"}, "financial-statements": {"id": "financial-statements", "name": "financial-statements", "desc": "Generate financial statements (income statement, balance sheet, cash flow) with period-over-period comparison and variance analysis. Use when preparing a monthly or quarterly P&L, closing the books and need to flag material variances, comparing actuals to budget, building a financial summary for leadership review, or looking up GAAP presentation requirements and period-end adjustments.", "path": "references/sources/knowledge-work-plugins/finance/skills/financial-statements/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/finance/skills/financial-statements/SKILL.md", "sha256": "1a9ba1cc85495eef32fa250b8a4c05e4854430af574a290b855f919dbb557dfc", "zh": "编制和分析财务报表"}, "variance-analysis": {"id": "variance-analysis", "name": "variance-analysis", "desc": "Decompose financial variances into drivers with narrative explanations and waterfall analysis. Use when analyzing budget vs. actual, period-over-period changes, revenue or expense variances, or preparing variance commentary for leadership.", "path": "references/sources/knowledge-work-plugins/finance/skills/variance-analysis/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/finance/skills/variance-analysis/SKILL.md", "sha256": "467db7de3fb118550d013409254e2d4a9f87385a661e154655bf3431919b0ba1", "zh": "解释预算与实际差额"}, "financial-analyst": {"id": "financial-analyst", "name": "financial-analyst", "desc": "Analyze financial statements, value a company with a DCF, explain budget variance, build rolling forecasts. Use whenever the user asks what a business is worth or why spend missed budget.", "path": "references/sources/claude-skills/finance/skills/financial-analyst/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/finance/skills/financial-analyst/SKILL.md", "sha256": "cf71815e44247f834605fa745d21b79a468f40449ba6c4602285f347d0d36f04", "zh": "分析财务比率与情景"}, "commercial-forecaster": {"id": "commercial-forecaster", "name": "commercial-forecaster", "desc": "Use when building a bookings, ARR, pipeline or NRR forecast, or a commit, best-case and pipeline board number. Forecasts with bookings_forecaster.py, projects cohorts with cohort_arr_projector.py and scores stage confidence with funnel_confidence_scorer.py, showing every conversion assumption.", "path": "references/sources/claude-skills/commercial/skills/commercial-forecaster/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/commercial/skills/commercial-forecaster/SKILL.md", "sha256": "7f5c6d47a1eaf79e578f280b8242ec87ef1c6bb8d20bef0caef9dcc7ff1f4b94", "zh": "预测商业收入与交付结果"}, "risk-assessment": {"id": "risk-assessment", "name": "risk-assessment", "desc": "Identify, assess, and mitigate operational risks. Trigger with \"what are the risks\", \"risk assessment\", \"risk register\", \"what could go wrong\", or when the user is evaluating risks associated with a project, vendor, process, or decision.", "path": "references/sources/knowledge-work-plugins/operations/skills/risk-assessment/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/operations/skills/risk-assessment/SKILL.md", "sha256": "82e29810a762c396a56f92bbd5c5afd252f7a07c6be69a246c28f7b82c4086d9", "zh": "记录风险、影响和缓解措施"}, "vendor-review": {"id": "vendor-review", "name": "vendor-review", "desc": "Evaluate a vendor — cost analysis, risk assessment, and recommendation. Use when reviewing a new vendor proposal, deciding whether to renew or replace a contract, comparing two vendors side-by-side, or building a TCO breakdown and negotiation points before procurement sign-off.", "path": "references/sources/knowledge-work-plugins/operations/skills/vendor-review/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/operations/skills/vendor-review/SKILL.md", "sha256": "c2a959a7ed068e34a83984cf223754062e6819deb0ba1ca33eb747b4cc808d5e", "zh": "评价供应商履约情况"}, "capacity-plan": {"id": "capacity-plan", "name": "capacity-plan", "desc": "Plan resource capacity — workload analysis and utilization forecasting. Use when heading into quarterly planning, the team feels overallocated and you need the numbers, deciding whether to hire or deprioritize, or stress-testing whether upcoming projects fit the people you have.", "path": "references/sources/knowledge-work-plugins/operations/skills/capacity-plan/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/operations/skills/capacity-plan/SKILL.md", "sha256": "3b8f1379471eae19e5be26c750681ad0c6054f4c8cdbf79c94309fcf46957ea8", "zh": "匹配工作量与可用产能"}, "process-optimization": {"id": "process-optimization", "name": "process-optimization", "desc": "Analyze and improve business processes. Trigger with \"this process is slow\", \"how can we improve\", \"streamline this workflow\", \"too many steps\", \"bottleneck\", or when the user describes an inefficient process they want to fix.", "path": "references/sources/knowledge-work-plugins/operations/skills/process-optimization/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/operations/skills/process-optimization/SKILL.md", "sha256": "14099838fdbfca24057e934fc22ed17f94629c5e9c9cec470f32e3063d0575f9", "zh": "分析流程瓶颈和改进机会"}, "procurement-optimizer": {"id": "procurement-optimizer", "name": "procurement-optimizer", "desc": "Cut spend on software and suppliers: SaaS audit, category spend review, slow purchasing cycles, supplier consolidation. Use whenever the user asks which tools or vendors to cut, where money goes, or why buying takes so long.", "path": "references/sources/claude-skills/business-operations/skills/procurement-optimizer/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/business-operations/skills/procurement-optimizer/SKILL.md", "sha256": "fd528725f6c20ba2e5428358facd8caa3e64eb972997cdbc068e6aa5754ed401", "zh": "分析采购成本与议价空间"}, "commercial-policy": {"id": "commercial-policy", "name": "commercial-policy", "desc": "Use when writing or revising discount rules: discount matrix, approver thresholds, exception flows and the deal framework sales works under. Builds the matrix with discount_matrix_builder.py, routes exceptions with exception_router.py and checks the policy with policy_linter.py.", "path": "references/sources/claude-skills/commercial/skills/commercial-policy/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/commercial/skills/commercial-policy/SKILL.md", "sha256": "30748ee0b904901872d139d38677fff1476101324b826348e8b10500283d7ca4", "zh": "制定折扣、价格与授权规则"}, "public-relations": {"id": "public-relations", "name": "public-relations", "desc": "When the user wants press and media coverage, or asks what to say to a reporter, whether a story is newsworthy, or how to handle a crisis: pitches, press releases, media lists, HARO, op-eds, podcast guest prep, newsjacking (public relations, not pull requests). For directories, see directory-submissions. For launches, see launch. For cold outreach to prospects, see cold-email.", "path": "references/sources/marketingskills/skills/public-relations/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/public-relations/SKILL.md", "sha256": "72bfaf639021d84635c60495931b8872fd25925ea407e3b398ff7d00dd5ee3ae", "zh": "制定媒体沟通策略"}, "internal-comms": {"id": "internal-comms", "name": "internal-comms", "desc": "Use when announcing a reorg, tool rollout, policy change, leadership change, layoff or acquisition internally. Builds the announcement with change_announcement_builder.py and sequences it with comms_calendar_builder.py.", "path": "references/sources/claude-skills/business-operations/skills/internal-comms/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/business-operations/skills/internal-comms/SKILL.md", "sha256": "24df7c5393d61d36a7baf122a6d543063951245abe25eced11f7ca6740f2e40e", "zh": "起草内部变更与事件沟通"}, "status-report": {"id": "status-report", "name": "status-report", "desc": "Generate a status report with KPIs, risks, and action items. Use when writing a weekly or monthly update for leadership, summarizing project health with green/yellow/red status, surfacing risks and decisions that need stakeholder attention, or turning a pile of project tracker activity into a readable narrative.", "path": "references/sources/knowledge-work-plugins/operations/skills/status-report/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/operations/skills/status-report/SKILL.md", "sha256": "8c3a21075294a5c5b7a1a7930613e53f0afbdbc12cf9e05d4bd08e6950c0a0d9", "zh": "汇报进度、风险和待决事项"}, "audit-support": {"id": "audit-support", "name": "audit-support", "desc": "Support SOX 404 compliance with control testing methodology, sample selection, and documentation standards. Use when generating testing workpapers, selecting audit samples, classifying control deficiencies, or preparing for internal or external audits.", "path": "references/sources/knowledge-work-plugins/finance/skills/audit-support/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/finance/skills/audit-support/SKILL.md", "sha256": "6e53c9529c42bb92c11d00a58af5119f7383903d9cb3b911625089fec2ff4784", "zh": "准备抽样证据和审计底稿"}, "sox-testing": {"id": "sox-testing", "name": "sox-testing", "desc": "Generate SOX sample selections, testing workpapers, and control assessments. Use when planning quarterly or annual SOX 404 testing, pulling a sample for a control (revenue, P2P, ITGC, close), building a testing workpaper template, or evaluating and classifying a control deficiency.", "path": "references/sources/knowledge-work-plugins/finance/skills/sox-testing/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/finance/skills/sox-testing/SKILL.md", "sha256": "5e5939a070a25d9696b27aaec6c20e64084e6f58637994b2f7ec92744074ea23", "zh": "测试财务报告内部控制"}, "iso27001-audit-prep": {"id": "iso27001-audit-prep", "name": "iso27001-audit-prep", "desc": "Use for /compliance-os:iso27001-audit-prep, or before an ISO 27001 internal, surveillance or stage 1 audit.", "path": "references/sources/claude-skills/compliance-os/skills/iso27001-audit-prep/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/compliance-os/skills/iso27001-audit-prep/SKILL.md", "sha256": "c2d682d578287a32f966ae0f1d6b4fa1a03f08d72ad392955504e770f15e6eff", "zh": "准备信息安全管理体系审计证据"}, "validate-data": {"id": "validate-data", "name": "validate-data", "desc": "QA an analysis before sharing -- methodology, accuracy, and bias checks. Use when reviewing an analysis before a stakeholder presentation, spot-checking calculations and aggregation logic, verifying a SQL query's results look right, or assessing whether conclusions are actually supported by the data.", "path": "references/sources/knowledge-work-plugins/data/skills/validate-data/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/skills/validate-data/SKILL.md", "sha256": "1e424822043480375b80aef9416227b1c8083af749ca536568716265f79ca54b", "zh": "核对分析数据与口径"}, "gdpr-audit-prep": {"id": "gdpr-audit-prep", "name": "gdpr-audit-prep", "desc": "Use for /compliance-os:gdpr-audit-prep, or before a GDPR review, post-breach audit or DPA investigation.", "path": "references/sources/claude-skills/compliance-os/skills/gdpr-audit-prep/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/compliance-os/skills/gdpr-audit-prep/SKILL.md", "sha256": "b061644c3cd94c4b18ea02b68749212f8e751d18b1745f1a29e732ff562d9de3", "zh": "准备个人数据保护审查材料"}, "access-lifecycle": {"id": "access-lifecycle", "name": "access-lifecycle", "desc": "Use when preparing or running a user access review, checking that leavers lost their access, finding orphaned or ownerless service accounts, answering an auditor's access-control request for SOC 2, ISO 27001, PCI DSS, HIPAA or NIST 800-53, or checking whether a finished review campaign will hold up. Diffs the HR roster against account exports, tests the campaign for coverage, self-review, unremoved revokes and rubber-stamping, and maps every exception to the controls it breaks.", "path": "references/sources/claude-skills/ra-qm-team/skills/access-lifecycle/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/ra-qm-team/skills/access-lifecycle/SKILL.md", "sha256": "2985de1165f8cacc829d0cf4bb0e5589095e74f1cd34fab38b4eda08e685223f", "zh": "对照人员与账户记录核查权限回收"}, "information-security-manager-iso27001": {"id": "information-security-manager-iso27001", "name": "information-security-manager-iso27001", "desc": "Use when designing or running an ISO 27001 ISMS in HealthTech or MedTech: risk assessment, control implementation, certification or security incidents. Assesses risk with risk_assessment.py and checks controls with compliance_checker.py.", "path": "references/sources/claude-skills/ra-qm-team/skills/information-security-manager-iso27001/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a wledge-work-plugins/data/skills/statistical-analysis/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/skills/statistical-analysis/SKILL.md", "sha256": "91a15cfc144efffcd622b09827362a73993a3ff30e3a78114801832477c9f8a0", "zh": "选择统计方法并解释结果"}, "create-viz": {"id": "create-viz", "name": "create-viz", "desc": "Create publication-quality visualizations with Python. Use when turning query results or a DataFrame into a chart, selecting the right chart type for a trend or comparison, generating a plot for a report or presentation, or needing an interactive chart with hover and zoom.", "path": "references/sources/knowledge-work-plugins/data/skills/create-viz/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/skills/create-viz/SKILL.md", "sha256": "3b13a9c2c9d2b1d36f9c323d952d93f578216f2094bc80d4be6fd4ccbfe9b77d", "zh": "为分析结果选择图形"}, "build-dashboard": {"id": "build-dashboard", "name": "build-dashboard", "desc": "Build an interactive HTML dashboard with charts, filters, and tables. Use when creating an executive overview with KPI cards, turning query results into a shareable self-contained report, building a team monitoring snapshot, or needing multiple charts with filters in one browser-openable file.", "path": "references/sources/knowledge-work-plugins/data/skills/build-dashboard/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/data/skills/build-dashboard/SKILL.md", "sha256": "6f23faa0b266820a23096f76df9d83e6b67597af4fc8c3306b4eba7e9f409f99", "zh": "构建可交互的数据看板"}, "sql-queries": {"id": "sql-queries", "name": "sql-queries", "desc": "Generate SQL queries from natural language descriptions. Supports BigQuery, PostgreSQL, MySQL, and other dialects. Reads database schemas from uploaded diagrams or documentation. Use when writing SQL, building data reports, exploring databases, or translating business questions into queries.", "path": "references/sources/pm-skills/pm-data-analytics/skills/sql-queries/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-data-analytics/skills/sql-queries/SKILL.md", "sha256": "18da062d5171607dcaa31eb277be420560e061bdcb0c960201e86c7067e2e59a", "zh": "按业务问题编写查询"}, "org-planning": {"id": "org-planning", "name": "org-planning", "desc": "Headcount planning, org design, and team structure optimization. Trigger with \"org planning\", \"headcount plan\", \"team structure\", \"reorg\", \"who should we hire next\", or when the user is thinking about team size, reporting structure, or organizational design.", "path": "references/sources/knowledge-work-plugins/human-resources/skills/org-planning/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/human-resources/skills/org-planning/SKILL.md", "sha256": "b3c6e33d251487225485c7fe455586f0cd490b282d7e41054273fa60820891ea", "zh": "规划组织结构与人力需求"}, "comp-analysis": {"id": "comp-analysis", "name": "comp-analysis", "desc": "Analyze compensation — benchmarking, band placement, and equity modeling. Trigger with \"what should we pay a [role]\", \"is this offer competitive\", \"model this equity grant\", or when uploading comp data to find outliers and retention risks.", "path": "references/sources/knowledge-work-plugins/human-resources/skills/comp-analysis/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/human-resources/skills/comp-analysis/SKILL.md", "sha256": "1af196cd1c38cdb96565eadebcf13fa25e979469b3e06f4791e18baa7f2534a6", "zh": "评估岗位薪酬区间"}, "recruiting-pipeline": {"id": "recruiting-pipeline", "name": "recruiting-pipeline", "desc": "Track and manage recruiting pipeline stages. Trigger with \"recruiting update\", \"candidate pipeline\", \"how many candidates\", \"hiring status\", or when the user discusses sourcing, screening, interviewing, or extending offers.", "path": "references/sources/knowledge-work-plugins/human-resources/skills/recruiting-pipeline/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/human-resources/skills/recruiting-pipeline/SKILL.md", "sha256": "a00b442f701faa6eb65b8ecc8fcf375d5a33ec827b987ba8b04edaef0e90b92f", "zh": "跟踪招聘漏斗"}, "interview-prep": {"id": "interview-prep", "name": "interview-prep", "desc": "Create structured interview plans with competency-based questions and scorecards. Trigger with \"interview plan for\", \"interview questions for\", \"how should we interview\", \"scorecard for\", or when the user is preparing to interview candidates.", "path": "references/sources/knowledge-work-plugins/human-resources/skills/interview-prep/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/human-resources/skills/interview-prep/SKILL.md", "sha256": "c687311babdeccf086aa5f6d86dcbfc3a9d1b8bb7124f072450ffa4315d98c4c", "zh": "设计岗位面试题与评分标准"}, "draft-offer": {"id": "draft-offer", "name": "draft-offer", "desc": "Draft an offer letter with comp details and terms. Use when a candidate is ready for an offer, assembling a total comp package (base, equity, signing bonus), writing the offer letter text itself, or prepping negotiation guidance for the hiring manager.", "path": "references/sources/knowledge-work-plugins/human-resources/skills/draft-offer/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/human-resources/skills/draft-offer/SKILL.md", "sha256": "b50f677f4c8fb769b9cd0be51cd250e0e21a4530d579d5f400b7d7b1b1a63ea9", "zh": "起草聘用条件"}, "onboarding-HR": {"id": "onboarding-HR", "name": "onboarding", "desc": "Generate an onboarding checklist and first-week plan for a new hire. Use when someone has a start date coming up, building the pre-start task list (accounts, equipment, buddy), scheduling Day 1 and Week 1, or setting 30/60/90-day goals for a new team member.", "path": "references/sources/knowledge-work-plugins/human-resources/skills/onboarding/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/human-resources/skills/onboarding/SKILL.md", "sha256": "c9210cdd00f8c2998a01c6d1310a8742aafa82a5861fb7c1c18686b72a56da97", "zh": "制定员工入职交接计划"}, "performance-review": {"id": "performance-review", "name": "performance-review", "desc": "Structure a performance review with self-assessment, manager template, and calibration prep. Use when review season kicks off and you need a self-assessment template, writing a manager review for a direct report, prepping rating distributions and promotion cases for calibration, or turning vague feedback into specific behavioral examples.", "path": "references/sources/knowledge-work-plugins/human-resources/skills/performance-review/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/human-resources/skills/performance-review/SKILL.md", "sha256": "a34e3f49e7c8619f07fd218cb2b6a6d57572dd7a0a78c72977dcd1739578e588", "zh": "整理绩效事实与评估反馈"}, "partnerships-architect": {"id": "partnerships-architect", "name": "partnerships-architect", "desc": "Use when deciding whether to sign a partner, at which tier (referral, reseller, OEM, SI, alliance), with what joint GTM and revshare. Runs partner_tier_classifier.py, revshare_modeler.py and joint_gtm_planner.py.", "path": "references/sources/claude-skills/commercial/skills/partnerships-architect/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/commercial/skills/partnerships-architect/SKILL.md", "sha256": "70c85d49d9708267929b61f8b2412b562178426d29e51732eb27d1d8ec7dd6f9", "zh": "设计合作伙伴模式和激励"}, "proposal-builder": {"id": "proposal-builder", "name": "proposal-builder", "desc": "Turns whatever came out of a discovery conversation — a call transcript, a voice memo, jobsite photos, an RFP document, a set of drawings, or scrappy notes — into a branded, costed proposal, estimate, or statement of work built on the owner's own templates and historical pricing. Routes it for signature and triggers the deposit invoice once it's accepted. Works entirely from uploaded files when no connector is available, producing DOCX and PDF the owner can send themselves. Use this whenever a quote, bid, estimate, proposal, or SOW is the deliverable — including phrasings like \"write this up for them,\" \"put together a quote,\" \"I need to bid this job,\" \"turn my notes into a proposal,\" \"respond to this RFP,\" or \"price this out.\" Reach for it when the owner describes a job they just looked at, even without saying the word quote.", "path": "references/sources/knowledge-work-plugins/small-business/skills/proposal-builder/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/small-business/skills/proposal-builder/SKILL.md", "sha256": "e558016c080898debf1e4e944826a562861c724144101cbc9ab6b99c0d362d0b", "zh": "整理客户提案"}, "account-plan": {"id": "account-plan", "name": "account-plan", "desc": "Build or refresh a strategic account plan - current state, goals, stakeholder coverage, opportunity map, risks, and the action plan - written to a doc and key fields synced to the CRM. Use when the user says \"build an account plan for [account]\", \"update the [account] plan\", \"account planning for [account]\", or before a planning cycle / QBR.", "path": "references/sources/knowledge-work-plugins/sales/skills/account-plan/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/account-plan/SKILL.md", "sha256": "b9facd0dfe322873e43757167b93bf3a312f0d0629c4cb9afa031912b64f5162", "zh": "制定重点客户经营计划"}, "deal-slip-scenario": {"id": "deal-slip-scenario", "name": "deal-slip-scenario", "desc": "Model what happens to your number if a deal slips, shrinks, or dies - quota impact, coverage ratio change, and the substitute pipeline needed to stay on plan. Use when the user asks \"what if [deal] slips\", \"what happens if [account] pushes to next quarter\", \"can I still hit my number without [deal]\", or \"model losing [deal]\".", "path": "references/sources/knowledge-work-plugins/sales/skills/deal-slip-scenario/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/sales/skills/deal-slip-scenario/SKILL.md", "sha256": "8860854b52d78db8fb76f4f019b1d322a321ab232302ae9b7d9007d3e0db5d23", "zh": "模拟延迟成交对预测的影响"}, "stakeholder-update": {"id": "stakeholder-update", "name": "stakeholder-update", "desc": "Generate a stakeholder update tailored to audience and cadence. Use when writing a weekly or monthly status for leadership, announcing a launch, escalating a risk or blocker, or translating the same progress into exec-brief, engineering-detail, or customer-facing versions.", "path": "references/sources/knowledge-work-plugins/product-management/skills/stakeholder-update/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/product-management/skills/stakeholder-update/SKILL.md", "sha256": "bcdb8ee95dc34d025dcc3d98e7435c4dca45930581b3b7a8707f8770dd364e79", "zh": "编写面向利益相关方的进展说明"}, "summarize-meeting": {"id": "summarize-meeting", "name": "summarize-meeting", "desc": "Summarize a meeting transcript into structured notes with date, participants, topic, key decisions, summary points, and action items. Use when processing meeting recordings, creating meeting notes, writing meeting minutes, or recapping discussions.", "path": "references/sources/pm-skills/pm-execution/skills/summarize-meeting/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/summarize-meeting/SKILL.md", "sha256": "4deabdd7f99c692ee800a80a4eaf6a688fb8873cdaaaea44b7f472499205f8e7", "zh": "提取会议决定、负责人和时限"}, "business-pulse": {"id": "business-pulse", "name": "business-pulse", "desc": "Produces a one-page cross-functional business snapshot for SMB owners — cash position (the ledger: MYOB, NetSuite, QuickBooks, Xero, or Zoho Books), sales trend (PayPal/Square/Stripe), pipeline movement (HubSpot), this week's commitments (Calendar), urgent watch-list items (Gmail or M365, Slack), and the single most important thing needing attention today. Proactively tries every available connector and gracefully scopes to whatever is connected — one connector gives a partial pulse; the full stack gives the full picture. Trigger when the user asks how the business is doing, wants a snapshot, a daily brief, a Friday recap, or says anything like \"what am I missing\" or \"catch me up on the business.\" A start-of-week briefing routes to /monday-brief, which runs this skill as its first link.", "path": "references/sources/knowledge-work-plugins/small-business/skills/business-pulse/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/small-business/skills/business-pulse/SKILL.md", "sha256": "289ac6813b4b11211411a6a323a2baf448c24c662c833db545402b79f2dd8a06", "zh": "汇总小企业经营信号"}, "invoice-chase": {"id": "invoice-chase", "name": "invoice-chase", "desc": "Drafts overdue-invoice reminder emails from the ledger (MYOB, NetSuite, QuickBooks, Xero, or Zoho Books) plus PayPal, Stripe, and Airwallex data, matched to each customer's payment history and tone (gentle for good customers, firm for repeat late payers). Sends via PayPal with owner approval; everything else queues as a mail draft, with the Airwallex hosted pay link included where one exists. Use when the user asks \"who owes me money,\" mentions overdue invoices, or wants to follow up on unpaid invoices.", "path": "references/sources/knowledge-work-plugins/small-business/skills/invoice-chase/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/small-business/skills/invoice-chase/SKILL.md", "sha256": "eb88e2dbbdf3dfb5e105b74886bf43a23caeddec9ea35bc36fabdf5d7c5c9619", "zh": "按账龄跟进逾期发票"}, "ap-processor": {"id": "ap-processor", "name": "ap-processor", "desc": "Works the bill pile end to end: reads bills and vendor statements out of the AP inbox or from uploaded PDFs and phone photos, pulls out vendor, amount, due date, and line detail, codes each one to the right account and job, matches it against the purchase order and the receiving ticket, then stages the entries and a proposed payment run in QuickBooks, Xero, or NetSuite for the owner to approve in one pass. Nothing is entered and nothing is paid without an explicit yes. Reach for this whenever bills, vendor invoices, or paying people comes up — including \"what do I owe,\" \"the bills are piling up,\" \"pull the invoices out of my email and into QuickBooks,\" \"code these for me,\" \"who needs to get paid this week,\" \"did we get billed twice,\" or when the owner forwards a supplier invoice with no message at all. Use it before cash-flow-snapshot or month-end-prep so those run on real payables instead of a guess.", "path": "references/sources/knowledge-work-plugins/small-business/skills/ap-processor/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/small-business/skills/ap-processor/SKILL.md", "sha256": "a2dbac917c45a114d886a8e2d4348c04415888a2b0d51c7f2946fcd210e7736d", "zh": "核对应付发票、凭证和到期日"}}, "sources": {"pm-skills": {"pushed": "2026-11-08T23:10:04Z", "stars": 28194, "url": "https://github.com/phuryn/pm-skills", "commit": "9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef", "license": "MIT"}, "marketingskills": {"pushed": "2026-11-20T02:15:08Z", "stars": 61649, "url": "https://github.com/coreyhaines31/marketingskills", "commit": "5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1", "license": "MIT"}, "knowledge-work-plugins": {"pushed": "2026-11-20T07:27:40Z", "stars": 36609, "url": "https://github.com/anthropics/knowledge-work-plugins", "commit": "0e0fcacddcc892eb92a1b7873ff9d68159c47571", "license": "Apache-2.0"}, "superpowers": {"pushed": "2026-11-03T23:24:58Z", "stars": 322600, "url": "https://github.com/obra/superpowers", "commit": "22f0b463e7a5e579904dd6211a520321035526f7", "license": "MIT"}, "claude-skills": {"pushed": "2026-11-19T07:26:37Z", "stars": 30181, "url": "https://github.com/alirezarezvani/claude-skills", "commit": "f8593c4941210a621a6629ce1da9e07897976d5f", "license": "MIT"}}, "edition": "2.0"}</script><script>
const {tasks,skills,sources}=JSON.parse(document.querySelector('#catalog').textContent),T=Object.fromEntries(tasks.map(t=>[t.key,t])), $=s=>document.querySelector(s);
let selected=tasks[0].key;
function el(tag,txt,parent,cls){const e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e}
function btn(txt,parent,k,cls){const b=el('button',txt,parent,cls);b.onclick=()=>{selected=k;render()};return b}
function href(txt,url,parent){let a=el('a',txt,parent);a.href=url;a.target='_blank';a.rel='noopener';return a}
const refs=k=>tasks.filter(t=>t.ids.includes(k));
$('#stats').textContent=tasks.length+' 项业务任务　·　'+Object.keys(skills).length+' 个上游技能　·　'+tasks.reduce((a,t)=>a+t.ids.length,0)+' 条任务引用';
for(const [n,v] of Object.entries(sources)){let p=el('p','',$('#sources'));href(n,v.url+'/tree/'+v.commit,p);p.append('　★ '+v.stars.toLocaleString()+'　'+v.license+'　最近推送 '+v.pushed.slice(0,10))}
function render(){const list=$('#list'),a=$('#detail'),q=$('#q').value.trim().toLowerCase(),dep=$('#dept').value;list.replaceChildren();a.replaceChildren();const scope=tasks.filter(t=>!dep||dep===t.dept);
const items=scope.filter(t=>(t.title+t.key+t.out+t.inp).includes(q)).map(t=>[t.key,t.title]);if(q)for(const [k,s] of Object.entries(skills)){if((k+s.zh+s.desc).toLowerCase().includes(q)&&scope.some(t=>t.ids.includes(k)))items.push([k,s.zh])}
$('#lt').textContent=q?'搜索结果 · '+items.length:'任务目录 · '+items.length;
for(const [k,n] of items){let b=btn(n,list,k);b.setAttribute('aria-current',k===selected);if(skills[k])el('small',k,b)}
if(!selected){el('p','没有匹配项，请调整搜索词或部门。',a);return}
const t=T[selected];if(t){let node=el('section','',a,'node');el('small',t.dept+'牵头',node);el('h2',t.title,node);el('p','输入：'+t.inp,node);el('p','交付：'+t.out,node);
el('h3','↓  按当前问题选用技能',a);let edges=el('div','',a,'edges');for(const k of t.ids){const s=skills[k],b=btn(s.zh,edges,k);el('small',s.name,b)}
el('h3','→  产物可交给',a);for(const n of t.nxt)btn(T[n].title,a,n,'chip')
}else{const s=skills[selected];let node=el('section','',a,'node');el('small',s.repo,node);el('h2',s.zh,node);el('code',s.name,node);el('h3','原作者简述',a);el('p',s.desc,a);href('查看固定版本原文 ↗',s.url,a);el('h3','←  哪些任务引用它',a);for(const p of refs(selected))btn(p.dept+' · '+p.title,a,p.key,'chip');el('h3','包内位置',a);el('code',s.path,a)}drawRelations();
}
function filter(){selected=null;render();const b=$('#list button');if(b)b.click()}

function drawRelations(){
 const host=document.querySelector('#detail'),selectedTask=T[selected],s=skills[selected];if(!selectedTask&&!s)return;
 const ids=selectedTask?selectedTask.ids:refs(selected).map(x=>x.key);
 const title=selectedTask?'任务 → 引用的技能':'引用此技能的任务 → 技能';
 const ns='http://www.w3.org/2000/svg',make=(tag,at,pa,tx)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(at))e.setAttribute(k,v);if(tx)e.textContent=tx;pa.append(e);return e};
 const frame=document.createElement('div');frame.className='localgraph';host.querySelector('.node').after(frame);let hh=Math.max(115,ids.length*57+32),mid=hh/2;
 const svg=make('svg',{viewBox:'0 0 720 '+hh,role:'group','aria-label':title},frame);
 function node(x,y,w,k,top,sub){const g=make('g',{class:'gn','data-key':k,tabindex:0,role:'button','aria-label':top+' '+sub},svg);make('rect',{x,y:y-23,width:w,height:46,rx:7,fill:T[k]?'#e1eee7':'#eee7f5',stroke:'#9fb3aa'},g);make('text',{x:x+9,y:y-3,'font-size':14,fill:'#143e36'},g,top);make('text',{x:x+9,y:y+15,'font-size':12,fill:'#4c645d'},g,sub)}
 for(const [i,k] of ids.entries()){let y=34+i*57;const a=selectedTask?mid:y,b=selectedTask?y:mid;
 make('path',{d:'M282 '+a+' C326 '+a+' 344 '+b+' 382 '+b,fill:'none',stroke:'#799489','stroke-width':1.6},svg);make('path',{d:'M375 '+(b-4)+'L384 '+b+'L375 '+(b+4)+'Z',fill:'#5a776d'},svg)}
 const draw=(x,y,w,k)=>{const t=T[k],v=skills[k];node(x,y,w,k,t?t.title:v.name,t?t.dept:v.zh)};
 draw(selectedTask?12:385,mid,selectedTask?270:326,selected);
 ids.forEach((k,i)=>draw(selectedTask?385:12,34+i*57,selectedTask?326:270,k));
}
function chooseGraph(e){const g=e.target.closest('.gn');if(!g)return;selected=g.dataset.key;render();document.querySelector('#detail').scrollIntoView({block:'start'})}
document.addEventListener('click',chooseGraph);document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.gn')){e.preventDefault();chooseGraph(e)}});
$('#dept').onchange=filter;$('#q').oninput=filter;render()
</script></html>
