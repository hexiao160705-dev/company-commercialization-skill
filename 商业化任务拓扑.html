": "references/sources/pm-skills/pm-product-strategy/skills/porters-five-forces/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-strategy/skills/porters-five-forces/SKILL.md", "sha256": "a010cd7e52e29456f5a11f1d40eb0342fde738e8cf685e81b4dd50a0ebb81309", "zh": "分析行业竞争与议价力量"}, "swot-analysis": {"id": "swot-analysis", "name": "swot-analysis", "desc": "Perform a detailed SWOT analysis — strengths, weaknesses, opportunities, and threats with actionable recommendations. Use when doing strategic assessment, competitive analysis, or evaluating a product or business position.", "path": "references/sources/pm-skills/pm-product-strategy/skills/swot-analysis/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-strategy/skills/swot-analysis/SKILL.md", "sha256": "ef5efbc2d4b84237469808cc9ce90016d926c0b3d65977f7edf21c60e3d5f85b", "zh": "梳理业务优势、弱点和外部机会威胁"}, "ansoff-matrix": {"id": "ansoff-matrix", "name": "ansoff-matrix", "desc": "Generate an Ansoff Matrix analysis mapping growth strategies across market penetration, market development, product development, and diversification. Use when considering growth options, planning market expansion, or evaluating strategic growth paths.", "path": "references/sources/pm-skills/pm-product-strategy/skills/ansoff-matrix/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-strategy/skills/ansoff-matrix/SKILL.md", "sha256": "2f2ffa5bc380d8df5d217334ef7b9f19941beaa2602fd2e7ac4f321f447a4153", "zh": "比较产品和市场的扩张方向"}, "competitor-analysis": {"id": "competitor-analysis", "name": "competitor-analysis", "desc": "Analyze competitors with strengths, weaknesses, and differentiation opportunities. Identifies direct competitors and maps the competitive landscape. Use when doing competitive research, preparing a competitive brief, or finding differentiation opportunities.", "path": "references/sources/pm-skills/pm-market-research/skills/competitor-analysis/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-market-research/skills/competitor-analysis/SKILL.md", "sha256": "8e627fc7fba96f223ad9f8fd23c6033a429cc28f9e9ce2d672854c6851810c2b", "zh": "对照竞品能力与定位"}, "product-vision": {"id": "product-vision", "name": "product-vision", "desc": "Brainstorm an inspiring, achievable, and emotional product vision that motivates teams and aligns stakeholders. Use when defining or refining a product vision, creating a vision statement, or aligning the team around a shared direction.", "path": "references/sources/pm-skills/pm-product-strategy/skills/product-vision/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-strategy/skills/product-vision/SKILL.md", "sha256": "1414332e0f7893963a3308b8bea0d3ac05f5d704ad344f1c0013f7d7804a12fe", "zh": "明确产品要创造的长期变化"}, "user-research": {"id": "user-research", "name": "user-research", "desc": "Plan, conduct, and synthesize user research. Trigger with \"user research plan\", \"interview guide\", \"usability test\", \"survey design\", \"research questions\", or when the user needs help with any aspect of understanding their users through research.", "path": "references/sources/knowledge-work-plugins/design/skills/user-research/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/design/skills/user-research/SKILL.md", "sha256": "fa18fc13d0f44aa869102962ef9466417ade726d659465195a40fbcf08cee156", "zh": "设计用户研究"}, "interview-script": {"id": "interview-script", "name": "interview-script", "desc": "Create a structured customer interview script with JTBD probing questions, warm-up, core exploration, and wrap-up sections. Follows The Mom Test principles — no leading questions, no pitching, focus on past behavior. Use when preparing for user interviews, creating interview guides, or planning discovery research.", "path": "references/sources/pm-skills/pm-product-discovery/skills/interview-script/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/interview-script/SKILL.md", "sha256": "892ca53da9852d4e6516d2305f0c0eb2db370bf39693c6c6797154b44bec9b4c", "zh": "编写非诱导式访谈提纲"}, "survey-design": {"id": "survey-design", "name": "survey-design", "desc": "Writing or reviewing a survey or questionnaire: customer feedback, NPS, CSAT, CES, pricing, market research, an in-app survey. Starts from the decision, asks about facts, pilots it, and reports the sample honestly.", "path": "references/sources/pm-skills/pm-market-research/skills/survey-design/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-market-research/skills/survey-design/SKILL.md", "sha256": "4ec88470d25b1d07d73ef14f677ea60a3c4082c28393413eeb8021fb483dd07c", "zh": "设计问卷与抽样方式"}, "live-polls": {"id": "live-polls", "name": "live-polls", "desc": "A poll or vote in a meeting, workshop or training: 'run a quick poll', dot-voting, a confidence vote, a word cloud, a quiz. Ask the room before the discussion and decide with the result. AskOne by default.", "path": "references/sources/pm-skills/pm-execution/skills/live-polls/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/live-polls/SKILL.md", "sha256": "0dc9c92f2c47feaefeda64579b0d81df537e363d0ddad551b36c40089db49da4", "zh": "准备现场投票题"}, "summarize-interview": {"id": "summarize-interview", "name": "summarize-interview", "desc": "Summarize a customer interview transcript into a structured template with JTBD, satisfaction signals, and action  points, and opportunities. Use when mapping the customer experience, identifying friction points, improving onboarding, or visualizing the user journey.", "path": "references/sources/pm-skills/pm-market-research/skills/customer-journey-map/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-market-research/skills/customer-journey-map/SKILL.md", "sha256": "656c0e16318b3b24870065a8eabb8a116b72e47c167472836ce76ea97ec5c75e", "zh": "标出客户旅程的触点和障碍"}, "research-synthesis": {"id": "research-synthesis", "name": "research-synthesis", "desc": "Synthesize user research into themes, insights, and recommendations. Use when you have interview transcripts, survey results, usability test notes, support tickets, or NPS responses that need to be distilled into patterns, user segments, and prioritized next steps.", "path": "references/sources/knowledge-work-plugins/design/skills/research-synthesis/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/design/skills/research-synthesis/SKILL.md", "sha256": "40048615dc81fc8b9b06104769498214d61a35ae4518a0995a12bbbd0ab945a1", "zh": "综合多项用户研究"}, "sentiment-analysis": {"id": "sentiment-analysis", "name": "sentiment-analysis", "desc": "Analyze user feedback data to identify segments with sentiment scores, JTBD, and product satisfaction insights. Use when analyzing user feedback at scale, running sentiment analysis on reviews or surveys, or identifying satisfaction patterns.", "path": "references/sources/pm-skills/pm-market-research/skills/sentiment-analysis/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-market-research/skills/sentiment-analysis/SKILL.md", "sha256": "516357ba8366845d13c4ee17acf96884571ad0fc8d3d48a2809c5cb84c95a01c", "zh": "整理反馈的情绪和主题"}, "identify-assumptions-new": {"id": "identify-assumptions-new", "name": "identify-assumptions-new", "desc": "Identify risky assumptions for a new product idea across 8 risk categories including Go-to-Market, Strategy, and Team. Use when evaluating startup risks, assessing a new product concept, or mapping assumptions for a new venture.", "path": "references/sources/pm-skills/pm-product-discovery/skills/identify-assumptions-new/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/identify-assumptions-new/SKILL.md", "sha256": "962b1e0c01e45ceb930e4d806c0ffb05e36cf25dcfef5497e7828d89d6ae474b", "zh": "识别新产品未经验证的假设"}, "identify-assumptions-existing": {"id": "identify-assumptions-existing", "name": "identify-assumptions-existing", "desc": "Identify risky assumptions for a feature idea in an existing product across Value, Usability, Viability, and Feasibility. Uses multi-perspective devil's advocate thinking. Use when stress-testing a feature idea, doing risk assessment, or preparing for assumption mapping.", "path": "references/sources/pm-skills/pm-product-discovery/skills/identify-assumptions-existing/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/identify-assumptions-existing/SKILL.md", "sha256": "59d788213014552ac64f589c71ce82b135f9ef4b84fec457446ad90795fd439f", "zh": "查找现有产品改动的隐含假设"}, "prioritize-assumptions": {"id": "prioritize-assumptions", "name": "prioritize-assumptions", "desc": "Prioritize assumptions using an Impact × Risk matrix and suggest experiments for each. Use when triaging a list of assumptions, deciding what to test first, or applying the assumption prioritization canvas.", "path": "references/sources/pm-skills/pm-product-discovery/skills/prioritize-assumptions/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/prioritize-assumptions/SKILL.md", "sha256": "18160a0138c788790c9dd22995ffdcfac485c1f0599c170d8668678e59766073", "zh": "按影响和证据排列假设"}, "brainstorm-experiments-new": {"id": "brainstorm-experiments-new", "name": "brainstorm-experiments-new", "desc": "Design lean startup experiments (pretotypes) for a new product. Creates XYZ hypotheses and suggests low-effort validation methods like landing pages, explainer videos, and pre-orders. Use when validating a new product idea, creating pretotypes, or testing market demand.", "path": "references/sources/pm-skills/pm-product-discovery/skills/brainstorm-experiments-new/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/brainstorm-experiments-new/SKILL.md", "sha256": "fe66d9ba76cf6b0e156298c88f752d8e1e62549fe77a7c01c0a74d8679da9334", "zh": "为新产品设计低成本实验"}, "brainstorm-experiments-existing": {"id": "brainstorm-experiments-existing", "name": "brainstorm-experiments-existing", "desc": "Design experiments to test assumptions for an existing product — prototypes, A/B tests, spikes, and other low-effort validation methods. Use when validating assumptions, testing feature ideas cheaply, or planning product experiments.", "path": "references/sources/pm-skills/pm-product-discovery/skills/brainstorm-experiments-existing/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/brainstorm-experiments-existing/SKILL.md", "sha256": "d72da1f4f08d5514662d7bad37dfc3ed4ef11fcc5b5ddec6ca5a8ac0e47f45c5", "zh": "为存量产品设计验证实验"}, "opportunity-solution-tree": {"id": "opportunity-solution-tree", "name": "opportunity-solution-tree", "desc": "Build an Opportunity Solution Tree (OST) to structure product discovery — map a desired outcome to opportunities, solutions, and experiments. Based on Teresa Torres' Continuous Discovery Habits. Use when structuring discovery work, mapping opportunities to solutions, or deciding what to build next.", "path": "references/sources/pm-skills/pm-product-discovery/skills/opportunity-solution-tree/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/opportunity-solution-tree/SKILL.md", "sha256": "6b23e44a5ace86aa20d64cc130322265ace6a53a29831cc403b974098a379bcc", "zh": "连接机会、方案和验证方法"}, "pre-mortem": {"id": "pre-mortem", "name": "pre-mortem", "desc": "Run a pre-mortem risk analysis on a PRD or launch plan. Categorizes risks as Tigers (real problems), Paper Tigers (overblown concerns), and Elephants (unspoken worries), then classifies as launch-blocking, fast-follow, or track. Use when preparing for launch, stress-testing a product plan, or identifying what could go wrong.", "path": "references/sources/pm-skills/pm-execution/skills/pre-mortem/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/pre-mortem/SKILL.md", "sha256": "0e5d92bdcf0e955be4c819d539b4de5054695b86ad465f4cdb03d4c8f7a0a3b9", "zh": "上线前推演失败原因"}, "ab-test-analysis": {"id": "ab-test-analysis", "name": "ab-test-analysis", "desc": "Analyze A/B test results with statistical significance, sample size validation, confidence intervals, and ship/extend/stop recommendations. Use when evaluating experiment results, checking if a test reached significance, interpreting split test data, or deciding whether to ship a variant.", "path": "references/sources/pm-skills/pm-data-analytics/skills/ab-test-analysis/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-data-analytics/skills/ab-test-analysis/SKILL.md", "sha256": "9956966671d6d19d42acb6150307fd7954d16d1d150e8fd8277f99eec9a949e0", "zh": "解读对照实验的效果与不确定性"}, "lean-canvas": {"id": "lean-canvas", "name": "lean-canvas", "desc": "Generate a Lean Canvas with problem, solution, metrics, cost structure, UVP, unfair advantage, channels, segments, and revenue. Use when exploring a lean startup canvas, testing a business hypothesis, or modeling a new venture.", "path": "references/sources/pm-skills/pm-product-strategy/skills/lean-canvas/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-strategy/skills/lean-canvas/SKILL.md", "sha256": "5bafe7a33cf57631937fa863ebc6c3d3b0679808a6e5b5fa04b70be615fbc240", "zh": "绘制精益商业画布"}, "business-model": {"id": "business-model", "name": "business-model", "desc": "Generate a Business Model Canvas with all 9 building blocks. Use when creating a business model, documenting how a business creates value, or analyzing an existing business model.", "path": "references/sources/pm-skills/pm-product-strategy/skills/business-model/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-strategy/skills/business-model/SKILL.md", "sha256": "515621fd8a41ecba5b7234d0d9e1e50185ba33805c4dd170b66364281f84acc8", "zh": "拆解收入、成本与关键伙伴"}, "value-proposition": {"id": "value-proposition", "name": "value-proposition", "desc": "Design a detailed value proposition using a 6-part JTBD template — Who, Why, What before, How, What after, Alternatives. Use when creating a value proposition, analyzing customer value delivery, or articulating why customers should choose your product.", "path": "references/sources/pm-skills/pm-product-strategy/skills/value-proposition/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-strategy/skills/value-proposition/SKILL.md", "sha256": "b07cc0399582fc178be31b513b313d2420c7941dd568b52a0bf6cfb0ab6c4ec7", "zh": "将客户痛点和产品价值对应"}, "monetization-strategy": {"id": "monetization-strategy", "name": "monetization-strategy", "desc": "Brainstorm 3-5 monetization strategies with audience fit, risks, and validation experiments. Use when exploring revenue models, evaluating pricing strategies, or deciding how to monetize a product.", "path": "references/sources/pm-skills/pm-product-strategy/skills/monetization-strategy/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-strategy/skills/monetization-strategy/SKILL.md", "sha256": "2306d3c987e9572258fa1327a864049965dda3e4e873093482c6b671d686eea5", "zh": "比较变现路径"}, "pricing-strategy": {"id": "pricing-strategy", "name": "pricing-strategy", "desc": "Analyze and design pricing strategies including pricing models, competitive pricing analysis, willingness-to-pay estimation, and price elasticity. Use when setting prices, evaluating pricing models, preparing for a pricing change, or comparing freemium vs paid approaches.", "path": "references/sources/pm-skills/pm-product-strategy/skills/pricing-strategy/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-strategy/skills/pricing-strategy/SKILL.md", "sha256": "09321c5984f3654077bd58921ec4b7235f47e00caf44445bd2e5a5ed13bcb895", "zh": "验证定价和套餐"}, "ideal-customer-profile": {"id": "ideal-customer-profile", "name": "ideal-customer-profile", "desc": "Identify the Ideal Customer Profile (ICP) from research data with demographics, behaviors, JTBD, and needs. Use when defining your ICP, analyzing PMF survey data, or understanding who your best customers are.", "path": "references/sources/pm-skills/pm-go-to-market/skills/ideal-customer-profile/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-go-to-market/skills/ideal-customer-profile/SKILL.md", "sha256": "8d434df786db2290efb575f1d219c7e19650e7a7e3df9a5f4b82b0bd0d2ce298", "zh": "定义理想客户画像"}, "channel-economics": {"id": "channel-economics", "name": "channel-economics", "desc": "Use for a direct vs partner channel review: fully loaded cost to serve, channel ROI and the best channel mix under constraints. Runs cost_to_serve_calculator.py, channel_roi_analyzer.py and channel_mix_optimizer.py.", "path": "references/sources/claude-skills/commercial/skills/channel-economics/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/commercial/skills/channel-economics/SKILL.md", "sha256": "3f103d44db38f453b5d5efaf6a5f23cc87d919d1e55d41fe738bf444a1aae97c", "zh": "比较各渠道的利润与回收周期"}, "saas-metrics-coach": {"id": "saas-metrics-coach", "name": "saas-metrics-coach", "desc": "Use when someone shares SaaS revenue or customer numbers, or asks about ARR, MRR, churn, LTV, CAC, NRR or how their SaaS is doing. Computes metrics with metrics_calculator.py, quick ratio and unit economics.", "path": "references/sources/claude-skills/finance/skills/saas-metrics-coach/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/finance/skills/saas-metrics-coach/SKILL.md", "sha256": "c05514d18aeeda298bc563d7347c260f0801865bd6d7b7c77a69f888d98b1735", "zh": "核算订阅业务的经营指标"}, "product-strategy": {"id": "product-strategy", "name": "product-strategy", "desc": "Create a comprehensive product strategy using the 9-section Product Strategy Canvas — vision, segments, costs, value propositions, trade-offs, metrics, growth, capabilities, and defensibility. Use when building a product strategy, creating a strategic plan, or defining product direction.", "path": "references/sources/pm-skills/pm-product-strategy/skills/product-strategy/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-strategy/skills/product-strategy/SKILL.md", "sha256": "50d4bfe62ae71a321271a491148e8dca4715a6a7550f82ffba2ded06f036d5b8", "zh": "把产品战略写成可执行选择"}, "brainstorm-ideas-new": {"id": "brainstorm-ideas-new", "name": "brainstorm-ideas-new", "desc": "Brainstorm feature ideas for a new product in initial discovery from PM, Designer, and Engineer perspectives. Use when starting product discovery for a new product, exploring features for a startup idea, or doing initial ideation.", "path": "references/sources/pm-skills/pm-product-discovery/skills/brainstorm-ideas-new/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/brainstorm-ideas-new/SKILL.md", "sha256": "400e5e0760d6dc52bfe34953d90db6223df532ce720d7e85568696ab5c3d34d2", "zh": "为新市场产生产品方案"}, "brainstorm-ideas-existing": {"id": "brainstorm-ideas-existing", "name": "brainstorm-ideas-existing", "desc": "Brainstorm product ideas for an existing product using multi-perspective ideation from PM, Designer, and Engineer viewpoints. Use when generating new feature ideas, brainstorming solutions for an identified opportunity, or ideating with a product trio.", "path": "references/sources/pm-skills/pm-product-discovery/skills/brainstorm-ideas-existing/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/brainstorm-ideas-existing/SKILL.md", "sha256": "cf950494541bd9b47e60054f1a917cef02094fe8c769d5feca86603282e2bd5b", "zh": "围绕现有产品寻找改进方向"}, "prioritize-features": {"id": "prioritize-features", "name": "prioritize-features", "desc": "Prioritize a backlog of feature ideas based on impact, effort, risk, and strategic alignment with top 5 recommendations. Use when prioritizing a feature backlog, making scope decisions, or ranking product ideas.", "path": "references/sources/pm-skills/pm-product-discovery/skills/prioritize-features/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-product-discovery/skills/prioritize-features/SKILL.md", "sha256": "d05c001ea9d71ccf6aca975e0530a2a85545192b1eec9e06cc6d1339156c0f87", "zh": "筛选最值得开发的功能"}, "prioritization-frameworks": {"id": "prioritization-frameworks", "name": "prioritization-frameworks", "desc": "Reference guide to 9 prioritization frameworks with formulas, when-to-use guidance, and templates — RICE, ICE, Kano, MoSCoW, Opportunity Score, and more. Use when selecting a prioritization method, comparing frameworks like RICE vs ICE, or learning how different prioritization approaches work.", "path": "references/sources/pm-skills/pm-execution/skills/prioritization-frameworks/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/prioritization-frameworks/SKILL.md", "sha256": "a5a5aa5235ea2e9381aafaefc799aa84a9ce27a4f14575c4f1c0cf835db9e7d8", "zh": "选择合适的优先级方法"}, "create-prd": {"id": "create-prd", "name": "create-prd", "desc": "Create a lean, decision-ready Product Requirements Document with an 8-section template: summary, contacts, background, objective, market segments, value propositions (6-part JTBD template), solution, and release. Lean by default (about one to two pages), with a fuller spec on request. Use when writing a PRD, documenting product requirements, preparing a feature spec, or reviewing an existing PRD.", "path": "references/sources/pm-skills/pm-execution/skills/create-prd/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/create-prd/SKILL.md", "sha256": "e3aa10a437ed7f748a957bd5d1eb06d8fa3f56dc728dcb93ce484387ecc3fa13", "zh": "编写产品需求文档"}, "user-stories": {"id": "user-stories", "name": "user-stories", "desc": "Create user stories following the 3 C's (Card, Conversation, Confirmation) and INVEST criteria with descriptions, design links, and acceptance criteria. Use when writing user stories, breaking down features into backlog items, or defining acceptance criteria.", "path": "references/sources/pm-skills/pm-execution/skills/user-stories/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/user-stories/SKILL.md", "sha256": "8ce89cd81de5a3df7d504380d18c54cec6c59ccdb7fd18cbcb62b6b6183d0a55", "zh": "把需求写成可验收的用户故事"}, "outcome-roadmap": {"id": "outcome-roadmap", "name": "outcome-roadmap", "desc": "Transform an output-focused roadmap into an outcome-focused one that communicates strategic intent. Rewrites initiatives as outcome statements reflecting user and business impacts. Use when shifting to outcome roadmaps, making a roadmap more strategic, or rewriting feature lists as outcomes.", "path": "references/sources/pm-skills/pm-execution/skills/outcome-roadmap/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/outcome-roadmap/SKILL.md", "sha256": "3d2da8f82f4cbe4c8d06593765e2fbb94913676e9a65663b7da9e53c9a0082c8", "zh": "用业务结果编排路线图"}, "sprint-plan": {"id": "sprint-plan", "name": "sprint-plan", "desc": "Plan a sprint with capacity estimation, story selection, dependency mapping, and risk identification. Use when preparing for sprint planning, estimating team capacity, selecting stories, or balancing sprint scope against velocity.", "path": "references/sources/pm-skills/pm-execution/skills/sprint-plan/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/sprint-plan/SKILL.md", "sha256": "54ac27165fd7d57fe3f598f1ef66087d03fbf56d9f583adf7608ccaca9ce3382", "zh": "按产能规划迭代范围"}, "brainstorm-okrs": {"id": "brainstorm-okrs", "name": "brainstorm-okrs", "desc": "Brainstorm team-level OKRs aligned with company objectives — qualitative objectives with measurable key results. Use when setting quarterly OKRs, aligning team goals with company strategy, drafting objectives, or learning how to write effective OKRs.", "path": "references/sources/pm-skills/pm-execution/skills/brainstorm-okrs/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/brainstorm-okrs/SKILL.md", "sha256": "9d4fcbc779aad7bcf4b4793148be31bec4bfe70e08f5885cf34635ecd08c47ee", "zh": "设计目标与关键结果"}, "stakeholder-map": {"id": "stakeholder-map", "name": "stakeholder-map", "desc": "Build a stakeholder map using a power/interest grid, identify communication strategies per quadrant, and generate a communication plan. Use when managing stakeholders, preparing for a launch, aligning cross-functional teams, or planning stakeholder engagement.", "path": "references/sources/pm-skills/pm-execution/skills/stakeholder-map/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/stakeholder-map/SKILL.md", "sha256": "f407f3a350c10d5c1674013b5903048e16357a50d49f6daa24a0ad475d40a3ed", "zh": "识别利益相关方及沟通需求"}, "design-critique": {"id": "design-critique", "name": "design-critique", "desc": "Get structured design feedback on usability, hierarchy, and consistency. Trigger with \"review this design\", \"critique this mockup\", \"what do you think of this screen?\", or when sharing a Figma link or screenshot for feedback at any stage from exploration to final polish.", "path": "references/sources/knowledge-work-plugins/design/skills/design-critique/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/design/skills/design-critique/SKILL.md", "sha256": "3a4f260eb9f60b431782bf6d90f22afb480c0c67860267a032df58a3e1bd19cd", "zh": "评审设计是否支持用户目标"}, "accessibility-review": {"id": "accessibility-review", "name": "accessibility-review", "desc": "Run a WCAG 2.1 AA accessibility audit on a design or page. Trigger with \"audit accessibility\", \"check a11y\", \"is this accessible?\", or when reviewing a design for color contrast, keyboard navigation, touch target size, or screen reader behavior before handoff.", "path": "references/sources/knowledge-work-plugins/design/skills/accessibility-review/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/design/skills/accessibility-review/SKILL.md", "sha256": "ef42982af0d51238dda2ab16d08626712891bdd41864876c32d1e7b13fb3124f", "zh": "检查无障碍使用障碍"}, "design-system": {"id": "design-system", "name": "design-system", "desc": "Audit, document, or extend your design system. Use when checking for naming inconsistencies or hardcoded values across components, writing documentation for a component's variants, states, and accessibility notes, or designing a new pattern that fits the existing system.", "path": "references/sources/knowledge-work-plugins/design/skills/design-system/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/design/skills/design-system/SKILL.md", "sha256": "fb31bd0144c43955106f01927126ae9fd2d4148be44c8d5887b3391f40c31445", "zh": "统一组件与交互规范"}, "ux-copy": {"id": "ux-copy", "name": "ux-copy", "desc": "Write or review UX copy — microcopy, error messages, empty states, CTAs. Trigger with \"write copy for\", \"what should this button say?\", \"review this error message\", or when naming a CTA, wording a confirmation dialog, filling an empty state, or writing onboarding text.", "path": "references/sources/knowledge-work-plugins/design/skills/ux-copy/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/design/skills/ux-copy/SKILL.md", "sha256": "d46a00a62ec637e9ca9d5f7823ea3e0a4ec26dffc53bb5035f59b48ebfcdcde7", "zh": "编写界面提示、错误和按钮文案"}, "design-handoff": {"id": "design-handoff", "name": "design-handoff", "desc": "Generate developer handoff specs from a design. Use when a design is ready for engineering and needs a spec sheet covering layout, design tokens, component props, interaction states, responsive breakpoints, edge cases, and animation details.", "path": "references/sources/knowledge-work-plugins/design/skills/design-handoff/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/design/skills/design-handoff/SKILL.md", "sha256": "38f1efc807928030654218443ad07f6a37ac82de6b4d627a03113a3568d787b7", "zh": "交接界面状态与实现细节"}, "copy-editing": {"id": "copy-editing", "name": "copy-editing", "desc": "When the user wants to edit, tighten, proofread, or refresh existing copy, or asks whether to keep, cut, or change a line in it, without rewriting from scratch. Every edit removes AI tells: 'it's not X, it's Y' reveals, 'no X, no Y, no Z' lists, and sentences that trail into extra comma clauses. A request to fix one line gets a point edit to that line only. For new copy, see copywriting.", "path": "references/sources/marketingskills/skills/copy-editing/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/copy-editing/SKILL.md", "sha256": "ef6bf9e792edac9ff524576a7eea6980fd13e605e5561736b045136341cde63e", "zh": "编辑营销文案并校对表达"}, "tech-stack-evaluator": {"id": "tech-stack-evaluator", "name": "tech-stack-evaluator", "desc": "Compare frameworks or tech stacks before committing: side-by-side scoring, total cost of ownership, ecosystem health and migration risk. Use whenever the user asks which framework to pick, X vs Y, whether to switch stacks, or if a migration is worth it.", "path": "references/sources/claude-skills/engineering-team/skills/tech-stack-evaluator/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/engineering-team/skills/tech-stack-evaluator/SKILL.md", "sha256": "20084dc9686afb30696ca8b588915b342146fbdc2fa3fab75fb8ff85106e0283", "zh": "按约束比较技术方案"}, "architecture": {"id": "architecture", "name": "architecture", "desc": "Create or evaluate an architecture decision record (ADR). Use when choosing between technologies (e.g., Kafka vs SQS), documenting a design decision with trade-offs and consequences, reviewing a system design proposal, or designing a new component from requirements and constraints.", "path": "references/sources/knowledge-work-plugins/engineering/skills/architecture/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/engineering/skills/architecture/SKILL.md", "sha256": "de7db3170a3ae1a894c70ef6cb555fe15618ed9b9674d20895eda3d2a0a5f9a2", "zh": "记录架构决策与取舍"}, "system-design": {"id": "system-design", "name": "system-design", "desc": "Design systems, services, and architectures. Trigger with \"design a system for\", \"how should we architect\", \"system design for\", \"what's the right architecture for\", or when the user needs help with API design, data modeling, or service boundaries.", "path": "references/sources/knowledge-work-plugins/engineering/skills/system-design/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/engineering/skills/system-design/SKILL.md", "sha256": "8f28eca99f2208872fc2483fcc93326b628f4f73116e91309a95e05da86a0ab5", "zh": "设计服务边界、数据流和接口"}, "writing-plans": {"id": "writing-plans", "name": "writing-plans", "desc": "Use when you have a spec or requirements for a multi-step task, before touching code", "path": "references/sources/superpowers/skills/writing-plans/SKILL.md", "repo": "superpowers", "url": "https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/writing-plans/SKILL.md", "sha256": "a6c67c1900064347c2a329990dd3c555657c51c3ec53b259a08aa01a2c26139a", "zh": "将需求拆成可验证的实施步骤"}, "test-driven-development": {"id": "test-driven-development", "name": "test-driven-development", "desc": "Use when implementing any feature or bugfix, before writing implementation code", "path": "references/sources/superpowers/skills/test-driven-development/SKILL.md", "repo": "superpowers", "url": "https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/test-driven-development/SKILL.md", "sha256": "64b03fce4aee5a97a93160cea8111f3ba13a17b7c001db4bd5836d67fd10705d", "zh": "用先失败的测试驱动实现"}, "executing-plans": {"id": "executing-plans", "name": "executing-plans", "desc": "Use when executing an implementation plan in the current session as the implementer yourself — your human partner chose inline execution, or no subagent tool is available", "path": "references/sources/superpowers/skills/executing-plans/SKILL.md", "repo": "superpowers", "url": "https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/executing-plans/SKILL.md", "sha256": "deaf176fa179827e80f2ea3101db3ea90fdf562ebef340eba761e4687940f5f5", "zh": "按计划逐项实施与验证"}, "using-git-worktrees": {"id": "using-git-worktrees", "name": "using-git-worktrees", "desc": "Use when starting feature work that needs isolation from current workspace or before executing implementation plans - ensures an isolated workspace exists via native tools or git worktree fallback", "path": "references/sources/superpowers/skills/using-git-worktrees/SKILL.md", "repo": "superpowers", "url": "https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/using-git-worktrees/SKILL.md", "sha256": "8cfb86f121269e8f7f12361e6795c4f6738828340e28964c9229d365666c9edd", "zh": "创建隔离的代码工作区"}, "receiving-code-review": {"id": "receiving-code-review", "name": "receiving-code-review", "desc": "Use when receiving code review feedback, before implementing suggestions, especially if feedback seems unclear or technically questionable - requires technical rigor and verification, not performative agreement or blind implementation", "path": "references/sources/superpowers/skills/receiving-code-review/SKILL.md", "repo": "superpowers", "url": "https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/receiving-code-review/SKILL.md", "sha256": "091df1629510af1b92fc4abd6f96732ebedb4cb2c0f3457e8f2740b0504a2438", "zh": "验证并处理代码评审意见"}, "code-review": {"id": "code-review", "name": "code-review", "desc": "Review code changes for security, performance, and correctness. Trigger with a PR URL or diff, \"review this before I merge\", \"is this code safe?\", or when checking a change for N+1 queries, injection risks, missing edge cases, or error handling gaps.", "path": "references/sources/knowledge-work-plugins/engineering/skills/code-review/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/engineering/skills/code-review/SKILL.md", "sha256": "6303932f1b301c614a6f5a0099cd87a19e1cd1b7cbfa1a1e11e996edbca6426b", "zh": "按风险检查代码变更"}, "finishing-a-development-branch": {"id": "finishing-a-development-branch", "name": "finishing-a-development-branch", "desc": "Use when implementation is complete, all tests pass, and you need to decide how to integrate the work", "path": "references/sources/superpowers/skills/finishing-a-development-branch/SKILL.md", "repo": "superpowers", "url": "https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/finishing-a-development-branch/SKILL.md", "sha256": "8db5a922b242dd4e1bf824cb91c13b3e8d8e8a86d6ceaf7f0774eb9cce909d65", "zh": "验证开发分支并选择集成方式"}, "testing-strategy": {"id": "testing-strategy", "name": "testing-strategy", "desc": "Design test strategies and test plans. Trigger with \"how should we test\", \"test strategy for\", \"write tests for\", \"test plan\", \"what tests do we need\", or when the user needs help with testing approaches, coverage, or test architecture.", "path": "references/sources/knowledge-work-plugins/engineering/skills/testing-strategy/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/engineering/skills/testing-strategy/SKILL.md", "sha256": "5c5e95830754bbdd838213fa05fc8f07523f591fd558fd3c86031ffd479f7a9e", "zh": "按风险设计测试覆盖"}, "test-scenarios": {"id": "test-scenarios", "name": "test-scenarios", "desc": "Create comprehensive test scenarios from user stories with test objectives, starting conditions, user roles, step-by-step actions, and expected outcomes. Use when writing QA test cases, creating test plans, defining acceptance tests, or preparing for feature validation.", "path": "references/sources/pm-skills/pm-execution/skills/test-scenarios/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/test-scenarios/SKILL.md", "sha256": "2dc10ebb6359604275f26234d3c66c9ccc952e501ad5b685c23a5c0f34f634d4", "zh": "列出正常、异常和边界测试场景"}, "dummy-dataset": {"id": "dummy-dataset", "name": "dummy-dataset", "desc": "Generate realistic dummy datasets for testing with customizable columns, constraints, and output formats (CSV, JSON, SQL, Python script). Use when creating test data, building mock datasets, or generating sample data for development and demos.", "path": "references/sources/pm-skills/pm-execution/skills/dummy-dataset/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/dummy-dataset/SKILL.md", "sha256": "35ca70a479f3c9cbdbee2d59c56d777886a8788aa79bd4bf3258b2cf557937aa", "zh": "生成测试用合成数据"}, "requesting-code-review": {"id": "requesting-code-review", "name": "requesting-code-review", "desc": "Use when completing tasks, implementing major features, or before merging to verify work meets requirements", "path": "references/sources/superpowers/skills/requesting-code-review/SKILL.md", "repo": "superpowers", "url": "https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/requesting-code-review/SKILL.md", "sha256": "2180e14a448e9410bec88e6646a2d1f0ce7fdd58de27388c1e052e929679d2bc", "zh": "准备变更范围并发起代码评审"}, "verification-before-completion": {"id": "verification-before-completion", "name": "verification-before-completion", "desc": "Use when about to claim work is complete, fixed, or passing, before committing or creating PRs - requires running verification commands and confirming output before making any success claims; evidence before assertions always", "path": "references/sources/superpowers/skills/verification-before-completion/SKILL.md", "repo": "superpowers", "url": "https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/verification-before-completion/SKILL.md", "sha256": "2befe7fc55bcadaa3d97dd9e8efeb633d2561c0ebe74c5a8b17c4d9e7e4520b3", "zh": "用实际执行结果核验完成声明"}, "deploy-checklist": {"id": "deploy-checklist", "name": "deploy-checklist", "desc": "Pre-deployment verification checklist. Use when about to ship a release, deploying a change with database migrations or feature flags, verifying CI status and approvals before going to production, or documenting rollback triggers ahead of time.", "path": "references/sources/knowledge-work-plugins/engineering/skills/deploy-checklist/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/engineering/skills/deploy-checklist/SKILL.md", "sha256": "85ca53dc471970e3e12c36ec814ebf5f6cb9419016c55adb05ff34789bae3be9", "zh": "检查部署、监控与回滚条件"}, "release-notes": {"id": "release-notes", "name": "release-notes", "desc": "Generate user-facing release notes from tickets, PRDs, or changelogs. Creates clear, engaging summaries organized by category (new features, improvements, fixes). Use when writing release notes, creating changelogs, announcing product updates, or summarizing what shipped.", "path": "references/sources/pm-skills/pm-execution/skills/release-notes/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/release-notes/SKILL.md", "sha256": "b617edd39e721267c9726286b6304f086991f5e2215b848c952a8ad9e001a0d3", "zh": "面向用户编写版本说明"}, "tech-debt": {"id": "tech-debt", "name": "tech-debt", "desc": "Identify, categorize, and prioritize technical debt. Trigger with \"tech debt\", \"technical debt audit\", \"what should we refactor\", \"code health\", or when the user asks about code quality, refactoring priorities, or maintenance backlog.", "path": "references/sources/knowledge-work-plugins/engineering/skills/tech-debt/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/engineering/skills/tech-debt/SKILL.md", "sha256": "ed3b4b1450c0fd9b8dad17313b5a4fafd8e6947d380b79b36a2e8259f3b1df0f", "zh": "识别和排序技术债务"}, "incident-response": {"id": "incident-response", "name": "incident-response", "desc": "Run an incident response workflow — triage, communicate, and write postmortem. Trigger with \"we have an incident\", \"production is down\", an alert that needs severity assessment, a status update mid-incident, or when writing a blameless postmortem after resolution.", "path": "references/sources/knowledge-work-plugins/engineering/skills/incident-response/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/engineering/skills/incident-response/SKILL.md", "sha256": "9eaa7a974c90395ac7116e82710f74546f38e69f735d78f684ee13fd79646e9a", "zh": "协调故障响应与恢复"}, "systematic-debugging": {"id": "systematic-debugging", "name": "systematic-debugging", "desc": "Use when encountering any bug, test failure, or unexpected behavior, before proposing fixes", "path": "references/sources/superpowers/skills/systematic-debugging/SKILL.md", "repo": "superpowers", "url": "https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/systematic-debugging/SKILL.md", "sha256": "51c6435d98c83c42c96ba7c35725a0b2c376cd487fb1a4e6bd0ddbe7e33ef202", "zh": "用观察和假设定位根因"}, "runbook": {"id": "runbook", "name": "runbook", "desc": "Create or update an operational runbook for a recurring task or procedure. Use when documenting a task that on-call or ops needs to run repeatably, turning tribal knowledge into exact step-by-step commands, adding troubleshooting and rollback steps to an existing procedure, or writing escalation paths for when things go wrong.", "path": "references/sources/knowledge-work-plugins/operations/skills/runbook/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/operations/skills/runbook/SKILL.md", "sha256": "c5c3eaa4c22fff96ec7239ce67eb3e100661b20a2818749e2f7ee21787233185", "zh": "编写可复用的操作手册"}, "change-request": {"id": "change-request", "name": "change-request", "desc": "Create a change management request with impact analysis and rollback plan. Use when proposing a system or process change that needs approval, preparing a change record for CAB review, documenting risk and rollback steps before a deployment, or planning stakeholder communications for a rollout.", "path": "references/sources/knowledge-work-plugins/operations/skills/change-request/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/operations/skills/change-request/SKILL.md", "sha256": "b1ee71cc1fecb22c7d27e2e00171f5d62fb54c405095b51098dacfea0447d8d7", "zh": "记录变更影响、审批与回退"}, "documentation": {"id": "documentation", "name": "documentation", "desc": "Write and maintain technical documentation. Trigger with \"write docs for\", \"document this\", \"create a README\", \"write a runbook\", \"onboarding guide\", or when the user needs help with any form of technical writing — API docs, architecture docs, or operational runbooks.", "path": "references/sources/knowledge-work-plugins/engineering/skills/documentation/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/engineering/skills/documentation/SKILL.md", "sha256": "1d469418f786a05be83d2a05f04d68788aeed584d13863a650f5ad73c6c4cf50", "zh": "编写工程文档"}, "retro": {"id": "retro", "name": "retro", "desc": "Facilitate a structured sprint retrospective — what went well, what didn't, and prioritized action items with owners and deadlines. Use when running a retrospective, reflecting on a sprint, creating action items from team feedback, or learning how to run effective retros.", "path": "references/sources/pm-skills/pm-execution/skills/retro/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-execution/skills/retro/SKILL.md", "sha256": "1559eafbaf7a7c1a0d3a736968b7fd9f2bb21489656661f5f70a61e6730c0c1e", "zh": "复盘迭代并分配改进行动"}, "process-doc": {"id": "process-doc", "name": "process-doc", "desc": "Document a business process — flowcharts, RACI, and SOPs. Use when formalizing a process that lives in someone's head, building a RACI to clarify who owns what, writing an SOP for a handoff or audit, or capturing the exceptions and edge cases of how work actually gets done.", "path": "references/sources/knowledge-work-plugins/operations/skills/process-doc/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/operations/skills/process-doc/SKILL.md", "sha256": "fceeeddb363e813ba831f9f2de1adb4c7e45ad179366bbb9ea9e40377abe96a9", "zh": "将业务流程整理成操作说明"}, "product-name": {"id": "product-name", "name": "product-name", "desc": "Brainstorm 5 unique, memorable product names with rationale aligned to brand values and target audience. Use when naming a new product, rebranding, or exploring product name ideas.", "path": "references/sources/pm-skills/pm-marketing-growth/skills/product-name/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-marketing-growth/skills/product-name/SKILL.md", "sha256": "16d715bbe6ab07b024a63a1a38f3616a3d9602bf4ca9425e1bb33496becce0b3", "zh": "生成并比较产品名称"}, "brand-guidelines": {"id": "brand-guidelines", "name": "brand-guidelines", "desc": "Use when writing or enforcing brand guidelines (colors, typography, logo rules, imagery, tone of voice), or checking an asset against them. Builds the color system, type scale and tone matrix, including Anthropic's identity.", "path": "references/sources/claude-skills/marketing-skill/skills/brand-guidelines/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/marketing-skill/skills/brand-guidelines/SKILL.md", "sha256": "039422de952148aecbb46a5ffeb1f3d24bcf116127d48c7ae35b770de1b3d74d", "zh": "明确品牌风格与一致性规则"}, "legal-risk-assessment": {"id": "legal-risk-assessment", "name": "legal-risk-assessment", "desc": "Assess and classify legal risks using a severity-by-likelihood framework with escalation criteria. Use when evaluating contract risk, assessing deal exposure, classifying issues by severity, or determining whether a matter needs senior counsel or outside legal review.", "path": "references/sources/knowledge-work-plugins/legal/skills/legal-risk-assessment/SKILL.md", "repo": "knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins/blob/0e0fcacddcc892eb92a1b7873ff9d68159c47571/legal/skills/legal-risk-assessment/SKILL.md", "sha256": "9f7985e3a98ac8419b52067cdaa1b72f754fa38c20489e7f0bf9de36347d4d89", "zh": "评估法律风险的影响和升级条件"}, "product-marketing": {"id": "product-marketing", "name": "product-marketing", "desc": "When the user wants to create or update the product marketing context doc (.agents/product-marketing.md), or asks what belongs in it or whether positioning or ICP is clear enough: product, ICP, positioning, competitors, customer language, brand voice. Use it before other marketing skills on a new project, when the audience or positioning changes, and to log learnings.", "path": "references/sources/marketingskills/skills/product-marketing/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/product-marketing/SKILL.md", "sha256": "8dbccc22998b3cac194c3509fa93d119163b82c9b0a1ce573e6737e5a5ccf555", "zh": "建立产品营销背景资料"}, "gtm-strategy": {"id": "gtm-strategy", "name": "gtm-strategy", "desc": "Create a go-to-market strategy covering marketing channels, messaging, success metrics, and launch timeline. Use when planning a product launch, creating a GTM plan from scratch, or defining a launch strategy for a new market.", "path": "references/sources/pm-skills/pm-go-to-market/skills/gtm-strategy/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-go-to-market/skills/gtm-strategy/SKILL.md", "sha256": "4b12597b63de4794c04faf226d996857370843681ab07f4b28d64a9d431a0ff7", "zh": "设计进入市场的路线"}, "gtm-motions": {"id": "gtm-motions", "name": "gtm-motions", "desc": "Identify the best GTM motions and tools across 7 motion types: Inbound, Outbound, Paid Digital, Community, Partners, ABM, and PLG. Use when selecting marketing channels, choosing between inbound and outbound strategy, or planning cross-channel campaigns.", "path": "references/sources/pm-skills/pm-go-to-market/skills/gtm-motions/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-go-to-market/skills/gtm-motions/SKILL.md", "sha256": "b26db17f9eee4f04aa3d53bf3c393da0574a3fa54d59eb7427e0cf5edf2377c3", "zh": "比较销售驱动等入市方式"}, "positioning-ideas": {"id": "positioning-ideas", "name": "positioning-ideas", "desc": "Brainstorm product positioning ideas differentiated from competitors. Identifies top competitors and generates positioning statements with rationale. Use when developing product positioning, differentiating from competitors, or crafting brand positioning strategy.", "path": "references/sources/pm-skills/pm-marketing-growth/skills/positioning-ideas/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-marketing-growth/skills/positioning-ideas/SKILL.md", "sha256": "8864f284e66c8bb106c46dc5e51656a47ae4792e39091eb3a49f63cde00c3850", "zh": "提出差异化定位"}, "value-prop-statements": {"id": "value-prop-statements", "name": "value-prop-statements", "desc": "Generate value proposition statements for marketing, sales, and onboarding from existing value propositions. Use when writing marketing copy, creating sales messaging, or crafting onboarding messages.", "path": "references/sources/pm-skills/pm-marketing-growth/skills/value-prop-statements/SKILL.md", "repo": "pm-skills", "url": "https://github.com/phuryn/pm-skills/blob/9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef/pm-marketing-growth/skills/value-prop-statements/SKILL.md", "sha256": "5f4e89542439b16d18af608d91d0a319c0e66a6d89257da38d6652a655aae5bc", "zh": "写出针对客群的价值主张"}, "launch": {"id": "launch", "name": "launch", "desc": "When the user wants to plan a product or feature launch, or asks whether it's ready, when to announce, or how to get noticed: Product Hunt, beta and early access, waitlists, release go-to-market, launch checklists, release notes. For marketing after launch, see marketing-ideas. For the offer, see offers.", "path": "references/sources/marketingskills/skills/launch/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/launch/SKILL.md", "sha256": "9d93f17367df59103fd932462cb170d1cfa5561d44e00423a52f7dadbce1bc3d", "zh": "安排发布活动和节奏"}, "marketing-plan": {"id": "marketing-plan", "name": "marketing-plan", "desc": "When the user wants a full marketing or go-to-market plan for a client, an advised company, or their own product, or asks how to sequence or prioritize several initiatives with a fixed team and budget: channels, budget, team, goals across AARRR, market sizing. For positioning first, see product-marketing. For ideas only, see marketing-ideas.", "path": "references/sources/marketingskills/skills/marketing-plan/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/marketing-plan/SKILL.md", "sha256": "9f4b07b78d58ea5c5da23e91e05304047df60685485c16c28352c0fb99a80ac0", "zh": "编制营销计划及衡量方法"}, "co-marketing": {"id": "co-marketing", "name": "co-marketing", "desc": "When the user wants co-marketing partners or joint campaigns, or asks whether a partner fits, a size mismatch matters, or how to split work and leads: integration partners, cross-promotion, co-branded content, joint webinars. For referral programs, see referrals. For launch partnerships, see launch. For running the event, see events.", "path": "references/sources/marketingskills/skills/co-marketing/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/co-marketing/SKILL.md", "sha256": "906c48e61f49c7c94e4e0c3bfdad9556c31b8c9312b55bb762df393dfa205adc", "zh": "组织合作伙伴联合推广"}, "events": {"id": "events", "name": "events", "desc": "When the user wants to plan, run, sponsor, or speak at events, or asks whether an event or booth is worth the money: webinars, conferences, booths, meetups, show-up rates, and follow-up into pipeline. For launches, see launch. For joint webinars, see co-marketing. For community programs, see community-marketing. For podcasts, see public-relations. For event emails, see emails.", "path": "references/sources/marketingskills/skills/events/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/events/SKILL.md", "sha256": "c563896eb4479cd13bea43fe89920e965400b6f994f81bc3703ea1a813ac3247", "zh": "策划活动获客与跟进"}, "ads": {"id": "ads", "name": "ads", "desc": "When the user wants to plan, run, or fix paid ads on Google, Meta, and LinkedIn, or asks a judgement call on them: are ads worth it, which channel or budget split, why CPA rose, kill or keep a campaign. End with facts, hypotheses, and missing data; label unavailable inputs MISSING instead of estimating. For ad copy, see ad-creative. For pixels and CAPI, see conversion-tracking. For landing pages, see cro.", "path": "references/sources/marketingskills/skills/ads/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/ads/SKILL.md", "sha256": "abed4d7d69b8dad1de41927d36ae249c63fe86aa302cbda5113c0c4ab4263f79", "zh": "规划与优化付费投放"}, "ad-creative": {"id": "ad-creative", "name": "ad-creative", "desc": "When the user wants to write or judge ad creative, or asks which ad, hook, or angle to run or kill: headlines, primary text, and variations for Google, Meta, LinkedIn, and TikTok, fresh angles when creative fatigues. Test hypotheses name the metric, comparison, and expected direction. No AI tells like 'it's not X, it's Y'. For campaign strategy, see ads. For landing pages, see copywriting.", "path": "references/sources/marketingskills/skills/ad-creative/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/ad-creative/SKILL.md", "sha256": "3bbdaafe85e7be03eb8501919eafbc804dbf6052c1597d3afff7756c1d72667f", "zh": "生成可测试的广告创意"}, "influencer-marketing": {"id": "influencer-marketing", "name": "influencer-marketing", "desc": "When the user wants creator, influencer, or ambassador partnerships, or asks which creators fit, what to pay, which rights to buy, or whether a sponsorship worked: vetting, contracts, briefs, UGC, newsletter and podcast sponsorships, FTC disclosure. For affiliate payouts, see referrals. For community advocacy, see community-marketing. For creator content as ads, see ad-creative.", "path": "references/sources/marketingskills/skills/influencer-marketing/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/influencer-marketing/SKILL.md", "sha256": "367e9ee7a88ca9280206858e76d795dc89eaea2a2ddaa6786ece8a089c11e4e5", "zh": "选择创作者并评估合作效果"}, "community-marketing": {"id": "community-marketing", "name": "community-marketing", "desc": "When the user wants to build or grow an online community, or asks whether a community is worth it, where to host it, or why members stay quiet: Discord, Slack, forums, participation, community-led growth, advocates. For referral programs, see referrals. For creator partnerships, see influencer-marketing.", "path": "references/sources/marketingskills/skills/community-marketing/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/community-marketing/SKILL.md", "sha256": "d5b84b418c3010bee36a19bb4ad45b8b39aebcc96d98c65ae8bd68e3b13333c5", "zh": "建设社区参与和反馈机制"}, "referrals": {"id": "referrals", "name": "referrals", "desc": "When the user wants referral and affiliate programs or word of mouth, or asks what to reward, how much to pay, or which loop to start with: refer-a-friend incentives, commissions and payouts, partner programs, 'made with' badges, review campaigns. For launch virality, see launch. For creator deals, see influencer-marketing.", "path": "references/sources/marketingskills/skills/referrals/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/referrals/SKILL.md", "sha256": "788d7a6f70142e069afe00bfc345cce6965e3e91d7aca0192b080552891aa523", "zh": "设计推荐奖励与传播流程"}, "lead-magnets": {"id": "lead-magnets", "name": "lead-magnets", "desc": "When the user wants to plan or improve a lead magnet, or asks what to give away for emails or how much to ask in return (gating, form fields): checklists, templates, ebooks, gated guides, content upgrades. For interactive tools, see free-tools. For the follow-up sequence, see emails. For popups that capture emails, see popups.", "path": "references/sources/marketingskills/skills/lead-magnets/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/lead-magnets/SKILL.md", "sha256": "858b6c0735e7c79b191416344eb3bb57cfdc2743ddc9d50b4bcbef820a9e98e1", "zh": "设计换取潜客联系意愿的内容"}, "free-tools": {"id": "free-tools", "name": "free-tools", "desc": "When the user wants to plan or build a free tool as marketing, or asks whether a tool idea is worth building or which one to pick: calculators, graders, generators, and other interactive tools for leads, SEO, and links. For downloadable lead magnets, see lead-magnets.", "path": "references/sources/marketingskills/skills/free-tools/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/free-tools/SKILL.md", "sha256": "cf89ce128533b0029bcb99270b2e7c9ed13746e11dfd7abb572f9667b2818040", "zh": "设计获客用免费工具"}, "seo-audit": {"id": "seo-audit", "name": "seo-audit", "desc": "When the user wants to audit or diagnose SEO, or asks why traffic dropped, a page won't rank, or whether a setup like canonicals, hreflang, or redirects is right: technical SEO, indexing, Google updates, on-page and titles, Core Web Vitals, local SEO. Start here when someone just says their SEO is bad. For pages at scale, see programmatic-seo. For structured data, see schema. For AI search, see ai-seo.", "path": "references/sources/marketingskills/skills/seo-audit/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/seo-audit/SKILL.md", "sha256": "edad34843d2c97a2380c4ee421efb6ce98414bf52660dbe8cec49b8b73acc393", "zh": "审查搜索收录与排名障碍"}, "site-architecture": {"id": "site-architecture", "name": "site-architecture", "desc": "When the user wants to plan or restructure a website, or asks which pages they need or where something belongs: hierarchy, navigation, URL structure, internal linking, website builders and migrations. Not XML sitemaps (see seo-audit). For structured data, see schema.", "path": "references/sources/marketingskills/skills/site-architecture/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/site-architecture/SKILL.md", "sha256": "0c71871aea12689012b4d85aaaf24a4752d3f0e985603c4992d5c0bf0fce57ea", "zh": "规划站点结构与内部链接"}, "schema": {"id": "schema", "name": "schema", "desc": "When the user wants to add, fix, or validate schema markup (JSON-LD), or asks which type fits a page or whether some markup is allowed: product, review, recipe, FAQ, rich result eligibility (FAQ no longer earns Google rich results), Search Console errors. For broader SEO, see seo-audit. For AI search, see ai-seo.", "path": "references/sources/marketingskills/skills/schema/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/schema/SKILL.md", "sha256": "673fa46bad2f2d4649955c473b11778bd2d258317662df670b31414e28725a84", "zh": "生成搜索结构化标记"}, "programmatic-seo": {"id": "programmatic-seo", "name": "programmatic-seo", "desc": "When the user wants SEO pages at scale from templates and data, or asks whether a page set will rank or look thin: location, integration, comparison, directory, and '[X] for [Y]' pages, each useful rather than thin. For SEO audits, see seo-audit. For content planning, see content-strategy.", "path": "references/sources/marketingskills/skills/programmatic-seo/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/programmatic-seo/SKILL.md", "sha256": "f59dcb0892fc615d6df8f6debedd6b08de910ad220d5ec4a18e62f076a934c00", "zh": "规划可规模化的搜索页面"}, "aso": {"id": "aso", "name": "aso", "desc": "When the user wants to audit or optimize an App Store or Google Play listing, or asks which title, keywords, or screenshots to pick or why downloads are low: subtitle, description, ratings, and comparing listings with competitors.", "path": "references/sources/marketingskills/skills/aso/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/aso/SKILL.md", "sha256": "c70e259ce5b7e71399a331ac1c8a7bf5985d5c5342b3dc1d03b37fcfa6b5ff55", "zh": "优化应用商店展示和转化"}, "social": {"id": "social", "name": "social", "desc": "When the user wants organic social content for LinkedIn, X, Instagram, TikTok, or Facebook, or asks what to post, which format to favor, or from which account: posts, threads, carousels, short-form video scripts, calendars, build-in-public posts from commits, listening. No AI tells like 'it's not X, it's Y' or broetry. For content strategy, see content-strategy. For paid ads, see ad-creative. For press, see public-relations.", "path": "references/sources/marketingskills/skills/social/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/social/SKILL.md", "sha256": "3c367239039ca820a4b5915d6c669a155bb4d52ac303cd34fac5d0795e7517a5", "zh": "设计社交渠道内容"}, "content-strategy": {"id": "content-strategy", "name": "content-strategy", "desc": "When the user wants to plan content, or asks which topic or piece to prioritize, what to write about, or why posts bring no customers: topic clusters, editorial calendars, roadmaps tied to customers and search. For writing pieces, see copywriting. For SEO audits, see seo-audit. For social content, see social.", "path": "references/sources/marketingskills/skills/content-strategy/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/content-strategy/SKILL.md", "sha256": "6bc1c8df711a6c9466e312dca9c99a895bd76989b7a52d0f39dca340db3bc5f5", "zh": "决定内容主题和分发组合"}, "copywriting": {"id": "copywriting", "name": "copywriting", "desc": "When the user wants to write or rewrite page copy (homepage, landing, pricing, feature), or asks which headline, promise, or message to lead with. Diagnoses the input first (blank brief, real voice, or point edit) and changes only what it calls for. Claims must be supportable; a declined claim names the evidence that would unlock it. No AI tells like 'it's not X, it's Y' or 'no X, no Y, no Z'. For editing, see copy-editing. For emails, see emails. For the offer, see offers.", "path": "references/sources/marketingskills/skills/copywriting/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/copywriting/SKILL.md", "sha256": "86dc0466493e8ac59ab17a8f28fd1403e2a322921ed2a8f96b2d0c442ad99d01", "zh": "撰写面向转化的营销文案"}, "content-humanizer": {"id": "content-humanizer", "name": "content-humanizer", "desc": "Make a draft sound less like AI: fix generic, robotic text with rhythm, specifics, personality and brand voice. Use whenever the user says copy sounds like ChatGPT, bland or stiff, or not like them.", "path": "references/sources/claude-skills/marketing-skill/skills/content-humanizer/SKILL.md", "repo": "claude-skills", "url": "https://github.com/alirezarezvani/claude-skills/blob/f8593c4941210a621a6629ce1da9e07897976d5f/marketing-skill/skills/content-humanizer/SKILL.md", "sha256": "6350b643b7a8aa8bbf713105ee61c069ab419448461311b74ba14afe2ecf189e", "zh": "去 AI 味：用具体事实和自然语气改写套话"}, "emails": {"id": "emails", "name": "emails", "desc": "When the user wants to create or improve automated email sequences, or asks what to send, when, or whether an email or flow is working: welcome, onboarding, nurture, and win-back flows. No AI tells like 'it's not X, it's Y', 'no X, no Y, no Z' lists, or fake 'Re:' subject lines. For cold outreach, see cold-email. For in-app onboarding, see onboarding. For texts, see sms.", "path": "references/sources/marketingskills/skills/emails/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/emails/SKILL.md", "sha256": "5687682141748000282747e85ef6501c0ad4c78731e138afc9b712ebb91ae750", "zh": "设计邮件序列与触达时机"}, "video": {"id": "video", "name": "video", "desc": "When the user wants to create video with AI tools or code, or asks which approach to use (screen recording, AI avatar, generated, or templated) or how to make videos repeatably: product demos, AI generation (Veo, Sora, HeyGen), programmatic video with Remotion. For what to post, see social. For video ads, see ad-creative.", "path": "references/sources/marketingskills/skills/video/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/video/SKILL.md", "sha256": "cbc6483db9cd316dc49166c8ab03340c1a1fbac5ff0101b61bd2131f91aaebdd", "zh": "策划营销视频与分发"}, "marketing-psychology": {"id": "marketing-psychology", "name": "marketing-psychology", "desc": "When the user wants to apply psychology to marketing, or asks why buyers behave or value things as they do, or whether a persuasion tactic is honest: biases, mental models, anchoring, social proof, scarcity, loss aversion, framing. For a page, see cro. For pricing tactics, see pricing. For copy, see copywriting.", "path": "references/sources/marketingskills/skills/marketing-psychology/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/marketing-psychology/SKILL.md", "sha256": "755efd52954ecbbddc6fd0fe07cfa4999b63544bf716f2b5587a50c6f26228c0", "zh": "用行为心理解释购买决策"}, "cro": {"id": "cro", "name": "cro", "desc": "When the user wants more conversions from a page or form, or asks why a page isn't converting, what to change first, or whether to add or remove a field or element: landing and pricing pages, lead forms, or a URL shared for feedback. For signup flows, see signup. For activation, see onboarding. For popups, see popups. For running the test, see ab-testing.", "path": "references/sources/marketingskills/skills/cro/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/cro/SKILL.md", "sha256": "0f8588aba125de102498ca3bbaa0151c8ebffa0a7ad85c14d992ef16db02fb2d", "zh": "诊断落地页与表单转化"}, "signup": {"id": "signup", "name": "signup", "desc": "When the user wants better signup, registration, and trial start flows, or asks which fields or steps to cut or whether to require a card: SSO and drop-off before an account exists. For what happens after signup, see onboarding. For lead forms that don't create an account, see cro.", "path": "references/sources/marketingskills/skills/signup/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/signup/SKILL.md", "sha256": "5d54fb404a0eeb04043899230ad15a72b327a1075cc2c220838caf0cdf6ec3b7", "zh": "减少注册流程流失"}, "onboarding": {"id": "onboarding", "name": "onboarding", "desc": "When the user wants better onboarding and activation, or asks why new users don't stick or what the first session should do: first-run experience, aha moments, checklists, empty states, time to value. For the signup flow itself, see signup. For onboarding emails, see emails.", "path": "references/sources/marketingskills/skills/onboarding/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/onboarding/SKILL.md", "sha256": "3118533cd06066715b6fa3c000e5d2994ad1c36b73cbf82501a9711381514880", "zh": "帮助新客户完成首次价值体验"}, "paywalls": {"id": "paywalls", "name": "paywalls", "desc": "When the user wants to create or improve in-app paywalls and upgrade moments, or asks when or how hard to ask free users to pay (after they've seen value): upgrade screens, upsell modals, feature gates, limit-reached and trial-expired screens, mobile subscription paywalls. For public pricing pages, see cro. For pricing decisions, see pricing.", "path": "references/sources/marketingskills/skills/paywalls/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/paywalls/SKILL.md", "sha256": "46edbabdf67b663e59d8fa283b4aeb0f3cbff99b0216ae52aa6fd607477faadf", "zh": "优化升级入口与付费墙"}, "popups": {"id": "popups", "name": "popups", "desc": "When the user wants to create or improve popups, modals, slide-ins, sticky bars, and banners, or asks whether one will help or annoy and when to show it: exit intent, email capture, scroll and time triggers, announcements. For forms and pages outside popups, see cro.", "path": "references/sources/marketingskills/skills/popups/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/popups/SKILL.md", "sha256": "fbbe47118ac0b9a18b3b07cc72bc6610c6a4f1c4c4817739c1e798bd8710ff64", "zh": "设计弹窗的时机与内容"}, "offers": {"id": "offers", "name": "offers", "desc": "When the user wants to design or improve the offer itself, or asks why it isn't selling or how to add urgency honestly: value stacking, bonuses, guarantees, scarcity, payment plans, upsells. Best for services, courses, coaching, and high-ticket B2B; for self-serve SaaS, read pricing first. For price and tiers, see pricing. For the page, see copywriting. For the launch, see launch. For sales collateral, see sales-enablement.", "path": "references/sources/marketingskills/skills/offers/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/offers/SKILL.md", "sha256": "d5de835c90e65c9fc117508760ca6df5d8d0ab546ffe6933beab089c944ba71c", "zh": "设计交易条件与优惠组合"}, "pricing": {"id": "pricing", "name": "pricing", "desc": "When the user wants to set pricing and packaging, or asks what to charge, whether to raise prices, or how to move existing customers: tiers, value metrics, per-seat vs usage, freemium and trials, willingness to pay, pricing pages. For in-app upgrade screens, see paywalls. For offers on services, courses, and high-ticket B2B, see offers.", "path": "references/sources/marketingskills/skills/pricing/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/pricing/SKILL.md", "sha256": "4f0a939631eca1b4bbee22bf6bc88b35ac06c33bfa8e4e837c8767a4bf6f5b54", "zh": "将套餐价值转化为定价页面和价格试验"}, "ab-testing": {"id": "ab-testing", "name": "ab-testing", "desc": "When the user wants to plan, run, or read A/B tests, or asks a judgement call on one: is the result real, can we stop, which version won, is this worth testing at all: sample size, duration, significance, hypotheses, and experiment backlogs. For tracking setup, see analytics. For page-level conversion fixes, see cro.", "path": "references/sources/marketingskills/skills/ab-testing/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/ab-testing/SKILL.md", "sha256": "938a9a9246c6b05657f509e7ab181f1c961dc14f9dcb5d452c574d3e44a39be2", "zh": "设计对照实验"}, "conversion-tracking": {"id": "conversion-tracking", "name": "conversion-tracking", "desc": "When the user wants to set up, audit, or fix conversion tracking to Google Ads, Meta, GA4, LinkedIn, and TikTok, or asks why conversions are missing or doubled: GTM, pixels, CAPI, Enhanced Conversions, offline imports. Fire on confirmed success, not the submit click; verify a test conversion arrives; diagnose before changing; offer free paths and disclose partner tools. For tracking plans, see analytics. For attribution, see attribution. For bidding, see ads.", "path": "references/sources/marketingskills/skills/conversion-tracking/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/conversion-tracking/SKILL.md", "sha256": "84a702f8583d468e039c6b53201b4189e895dde30a40883bffdee37f65d704b9", "zh": "定义并校验转化事件"}, "attribution": {"id": "attribution", "name": "attribution", "desc": "When the user wants to work out which marketing drives revenue, or asks whether a channel is really working, which numbers to trust, or how to credit podcasts and dark social: attribution models, platforms that over-claim, MMM, incrementality and holdout tests, self-reported attribution. For tracking and UTMs, see analytics. For pixels and CAPI, see conversion-tracking. For CRM revenue, see revops. For AI search blind spots, see ai-seo.", "path": "references/sources/marketingskills/skills/attribution/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/attribution/SKILL.md", "sha256": "b8db5580db926f92b64a6d4d3ae5f17eb375249bf238a11c7a0809c84c58795e", "zh": "判断各渠道对转化的贡献"}, "analytics": {"id": "analytics", "name": "analytics", "desc": "When the user wants to set up or audit analytics, or asks whether a metric or number is calculated right, what to track, or how to name events: tracking plans, GA4, GTM, Mixpanel, PostHog, UTMs. Rate metrics divide matching closed windows, never full-period spend by partial-period results. For conversions in ad platforms, see conversion-tracking. For attribution or platforms that over-claim, see attribution. For tests, see ab-testing.", "path": "references/sources/marketingskills/skills/analytics/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/analytics/SKILL.md", "sha256": "45f0d00c1f8ea9ef836882a1ebbc1dadca12f96db8e921c4252e34a4126c903a", "zh": "设计营销数据采集与分析"}, "prospecting": {"id": "prospecting", "name": "prospecting", "desc": "When the user wants to find and qualify prospects for outbound, or asks who to target first, which signal to prioritize, or where to spot buyers with the problem: buying signals, enrichment, verification, account research. Verify emails before a sequence, never scrape LinkedIn: define audiences in Sales Navigator and pull contacts from licensed data. For outreach, see cold-email. For competitor research, see competitor-profiling.", "path": "references/sources/marketingskills/skills/prospecting/SKILL.md", "repo": "marketingskills", "url": "https://github.com/coreyhaines31/marketingskills/blob/5b2b400eec1e7e1cec76245a715d0b0d4fd2a9c1/skills/prospecting/SKILL.md", "sha256": "dd9343bdcc3dadd059c4155e818778377bd62f3e704322d1073d9f06656d4315", "zh": "寻找匹配的潜在客户"}, "lead-triage": {"id": "lead-triage", "name": "lead-triage", "desc": "Score and route an inbound lead, or rank a backlog of leads, against your ICP and qualification framework, then recommend a priority and
